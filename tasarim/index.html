<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boykot · Küresel Gözlem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --zemin:#06080b; --yuzey:#0b0f14; --yuzey2:#10161d; --cizgi:#18202a; --cizgi2:#243040; --izgara:rgba(120,150,190,.05);
  --metin:#dfe4ea; --ikincil:#8792a2; --sonuk:#566173;
  --aksan:#ff4d2e; --aksan-zemin:rgba(255,77,46,.09); --sari:#e2a33b; --basari:#3ecf8e; --gri:#8792a2;
  --kara:#5b6d84; --sinir:#4a5c74; --atmosfer:#6b8bb0;
  --sans:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif; --mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,monospace;
  --ust:44px; --sol:300px; --sag:380px; --alt:176px;
}
:root[data-tema="acik"]{
  --zemin:#f3f1ec; --yuzey:#faf9f6; --yuzey2:#ffffff; --cizgi:#e1ddd4; --cizgi2:#cfc9bd; --izgara:rgba(40,50,70,.05);
  --metin:#14171c; --ikincil:#5a626e; --sonuk:#8b919a;
  --aksan:#d63a1c; --aksan-zemin:rgba(214,58,28,.07); --sari:#b7791f; --basari:#1f8a5b; --gri:#6b7480;
  --kara:#8a95a2; --sinir:#a7b0bb; --atmosfer:#7d93ab;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--zemin);color:var(--metin);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.m{font-family:var(--mono);font-feature-settings:"zero" 1}
.e{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sonuk)}
:lang(zh) .e{letter-spacing:.06em}
:focus-visible{outline:1px solid var(--aksan);outline-offset:1px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--cizgi2)}::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--cizgi2) transparent}

/* ---- İskelet ---- */
.ust{position:fixed;inset:0 0 auto 0;height:var(--ust);display:flex;align-items:stretch;border-bottom:1px solid var(--cizgi);background:var(--zemin);z-index:10}
.ust>*{display:flex;align-items:center;padding:0 14px;border-right:1px solid var(--cizgi)}
.logo{gap:10px;width:var(--sol)}
.logo b{font-weight:600;letter-spacing:.22em;font-size:13px}
.logo .surum{margin-left:auto}
.isaret{width:8px;height:8px;background:var(--aksan);transform:rotate(45deg)}
.komut{flex:1;gap:10px;color:var(--sonuk);cursor:text;min-width:0}
.komut input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-family:var(--mono);font-size:12px;color:var(--metin)}
.komut input::placeholder{color:var(--sonuk)}
.tus{font-family:var(--mono);font-size:10px;border:1px solid var(--cizgi2);padding:1px 5px;color:var(--sonuk)}
.sekmeler{padding:0;gap:0}
.sekme{height:100%;padding:0 16px;background:transparent;border:0;border-right:1px solid var(--cizgi);font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--sonuk);cursor:pointer;position:relative;white-space:nowrap}
.sekme:last-child{border-right:0}
.sekme:hover{color:var(--metin)}
.sekme[aria-selected="true"]{color:var(--metin)}
.sekme[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--aksan)}
#brifingAc{color:var(--aksan)}
.durum-blok{gap:16px;font-family:var(--mono);font-size:11px;color:var(--ikincil);white-space:nowrap}
.canli{display:flex;align-items:center;gap:6px}
.canli::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--basari);animation:nabiz 2s infinite}
@keyframes nabiz{50%{opacity:.3}}
.diller{padding:0 6px;gap:0}
.dil{height:26px;padding:0 7px;border:0;background:transparent;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--sonuk);cursor:pointer}
.dil[aria-pressed="true"]{color:var(--metin);box-shadow:inset 0 -1px var(--aksan)}
.dil:hover{color:var(--metin)}
.ikonlar{gap:4px;padding:0 8px;border-right:0}
.ik{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--ikincil);cursor:pointer}
.ik:hover{border-color:var(--cizgi2);color:var(--metin)}
.ik svg{width:15px;height:15px}

.sol,.sag{position:fixed;top:var(--ust);bottom:var(--alt);background:var(--zemin);z-index:5;overflow:auto}
.sol{left:0;width:var(--sol);border-right:1px solid var(--cizgi)}
.sag{right:0;width:var(--sag);border-left:1px solid var(--cizgi)}
.blok{border-bottom:1px solid var(--cizgi)}
.blok-bas{display:flex;align-items:center;justify-content:space-between;height:30px;padding:0 12px;border-bottom:1px solid var(--cizgi);background:var(--yuzey)}
.blok-ic{padding:10px 12px}

.katman{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:12px;color:var(--ikincil)}
.katman input{appearance:none;width:12px;height:12px;border:1px solid var(--cizgi2);display:grid;place-items:center;cursor:pointer}
.katman input:checked{border-color:var(--metin)}
.katman input:checked::after{content:"";width:6px;height:6px;background:var(--metin)}
.katman:hover{color:var(--metin)}
.katman .m{font-size:11px;color:var(--sonuk)}

.ciplar{display:flex;flex-wrap:wrap;gap:4px}
.cip{height:22px;padding:0 8px;border:1px solid var(--cizgi2);background:transparent;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--sonuk);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cip[aria-pressed="true"]{color:var(--metin);border-color:var(--ikincil);background:var(--yuzey2)}
.nokta{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.tablo{width:100%;border-collapse:collapse}
.tablo th{position:sticky;top:0;background:var(--zemin);text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--sonuk);font-weight:400;padding:6px 12px;border-bottom:1px solid var(--cizgi)}
.tablo td{padding:7px 12px;border-bottom:1px solid var(--cizgi);vertical-align:middle;white-space:nowrap}
.tablo tr.satir{cursor:pointer}
.tablo tr.satir:hover td{background:var(--yuzey)}
.tablo tr.satir[aria-selected="true"] td{background:var(--yuzey2)}
.tablo tr.satir[aria-selected="true"] td:first-child{box-shadow:inset 2px 0 var(--aksan)}
.tablo .kod{font-family:var(--mono);font-size:10.5px;color:var(--sonuk)}
.tablo .ad{font-weight:500}
.tablo .sag-h{text-align:right;font-family:var(--mono);font-size:11px;color:var(--ikincil)}

#sahne{position:fixed;top:var(--ust);left:var(--sol);right:var(--sag);bottom:var(--alt);z-index:1;overflow:hidden;background:
  linear-gradient(var(--izgara) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,var(--izgara) 1px,transparent 1px) 0 0/40px 40px, var(--zemin)}
#kure{position:absolute;inset:0}
#kure canvas{display:block}
.hud{position:absolute;pointer-events:none;font-family:var(--mono);font-size:10.5px;color:var(--sonuk);line-height:1.6;z-index:2;transition:opacity .5s}
.hud b{color:var(--ikincil);font-weight:400}
.k-sol-ust{left:14px;top:12px}.k-sag-ust{right:14px;top:12px;text-align:right}.k-sol-alt{left:14px;bottom:30px}.k-sag-alt{right:14px;bottom:30px;text-align:right}
.kose{position:absolute;width:14px;height:14px;border-color:var(--cizgi2);border-style:solid;pointer-events:none;z-index:2;transition:opacity .5s}
.kose.a{left:6px;top:6px;border-width:1px 0 0 1px}.kose.b{right:6px;top:6px;border-width:1px 1px 0 0}.kose.c{left:6px;bottom:6px;border-width:0 0 1px 1px}.kose.d{right:6px;bottom:6px;border-width:0 1px 1px 0}
.olcek{display:flex;align-items:flex-end;gap:6px;justify-content:flex-end}
.olcek i{display:block;width:80px;height:5px;border:1px solid var(--sonuk);border-top:0}
.nisan{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;pointer-events:none;z-index:3;display:none}
.nisan::before,.nisan::after,.nisan i::before,.nisan i::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--aksan);border-style:solid}
.nisan::before{left:0;top:0;border-width:1px 0 0 1px}.nisan::after{right:0;top:0;border-width:1px 1px 0 0}
.nisan i::before{left:0;bottom:0;border-width:0 0 1px 1px}.nisan i::after{right:0;bottom:0;border-width:0 1px 1px 0}
.nisan-etiket{position:absolute;left:64px;top:-6px;white-space:nowrap;font-family:var(--mono);font-size:10.5px;line-height:1.55;color:var(--ikincil);padding-left:10px;border-left:1px solid var(--aksan)}
.nisan-etiket b{color:var(--metin);font-weight:500;font-size:11.5px;letter-spacing:.04em}
.ipucu{position:fixed;z-index:20;pointer-events:none;padding:4px 8px;border:1px solid var(--cizgi2);background:var(--yuzey2);font-family:var(--mono);font-size:11px;opacity:0;transform:translate(12px,-50%)}
#ag{position:absolute;inset:0;display:none}
#ag svg{width:100%;height:100%}
.ag-dugum{cursor:pointer}
.ag-dugum text{font-family:var(--mono);font-size:10px;fill:var(--ikincil)}

.dosya-bas{padding:14px 14px 12px;border-bottom:1px solid var(--cizgi)}
.dosya-bas .ust-satir{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dosya-bas h2{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.etiket{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em}
.etiket.kutu-et{border:1px solid currentColor;padding:2px 7px}
.d-bds{color:var(--aksan)}.d-baski{color:var(--sari)}.d-halk{color:var(--gri)}.d-sonuc{color:var(--basari)}
.alanlar{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--cizgi)}
.alanlar div{padding:8px 14px;border-right:1px solid var(--cizgi)}
.alanlar div:last-child{border-right:0}
.alanlar .m{font-size:12px;color:var(--metin);display:block;margin-top:2px}
.bolum{border-bottom:1px solid var(--cizgi);padding:12px 14px}
.bolum>.e{display:flex;justify-content:space-between;margin-bottom:8px}
.neden{font-size:14px;line-height:1.6}
.cubuklar{display:grid;gap:7px}
.cubuk{display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:10px;font-size:11.5px;color:var(--ikincil)}
.cubuk .yol{height:4px;background:var(--cizgi)}
.cubuk .dolu{display:block;height:100%;background:var(--metin)}
.cubuk .m{text-align:right;font-size:11px}
.zaman{list-style:none}
.zaman li{display:grid;grid-template-columns:62px 12px 1fr;gap:8px;padding:3px 0;font-size:12.5px}
.zaman time{font-family:var(--mono);font-size:11px;color:var(--sonuk)}
.zaman i{width:7px;height:7px;border:1px solid var(--aksan);margin-top:5px;transform:rotate(45deg)}
.kaynaklar{list-style:none}
.kaynaklar a{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--cizgi);color:var(--metin);text-decoration:none;font-size:12.5px}
.kaynaklar li:first-child a{border-top:0}
.kaynaklar a:hover span:nth-child(2){text-decoration:underline}
.kaynaklar .m{font-size:10.5px;color:var(--sonuk)}
.markalar{display:flex;flex-wrap:wrap;gap:4px}
.markalar span{font-size:11.5px;padding:2px 7px;border:1px solid var(--cizgi2);color:var(--ikincil)}
.dipnot{padding:12px 14px;font-size:11px;color:var(--sonuk)}
.dipnot a{color:var(--ikincil)}
.kapat{width:24px;height:24px;border:1px solid var(--cizgi2);background:transparent;color:var(--ikincil);cursor:pointer;font-family:var(--mono)}
.yigin{display:flex;height:8px;gap:2px;margin:4px 0 8px}
.yigin span{height:100%}
.lejant{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.lejant div{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ikincil)}

.alt{position:fixed;left:0;right:0;bottom:0;height:var(--alt);border-top:1px solid var(--cizgi);background:var(--zemin);z-index:6;display:grid;grid-template-columns:minmax(0,1fr) 520px}
.zc{border-right:1px solid var(--cizgi);display:flex;flex-direction:column;min-width:0}
.zc svg{flex:1;width:100%;display:block}
.zc .tik{cursor:pointer}
.zc .eksen text{font-family:var(--mono);font-size:10px;fill:var(--sonuk)}
.gunluk{display:flex;flex-direction:column;min-height:0}
.gunluk ol{list-style:none;overflow:auto;flex:1;font-family:var(--mono);font-size:11px}
.gunluk li{display:grid;grid-template-columns:78px 58px 1fr;gap:10px;padding:5px 12px;border-bottom:1px solid var(--cizgi);cursor:pointer;color:var(--ikincil)}
.gunluk li:hover{background:var(--yuzey);color:var(--metin)}
.gunluk li .tur{color:var(--sonuk)}
.gunluk li .tur.h{color:var(--aksan)}
.gunluk li span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--sans);font-size:12px}
.yeni{animation:yeni 1.6s}
@keyframes yeni{from{background:var(--aksan-zemin)}}
.dip{position:fixed;left:var(--sol);right:var(--sag);bottom:var(--alt);height:22px;z-index:4;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--sonuk)}
.dip a{color:var(--ikincil);margin-left:6px}

.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(2,3,5,.6);padding:16px}
.modal.acik{display:flex}
.modal-ic{width:min(480px,100%);background:var(--yuzey);border:1px solid var(--cizgi2)}
.modal-ic .blok-bas{background:var(--yuzey2)}
.modal-ic .ic{padding:16px}
.modal p{color:var(--ikincil);font-size:12.5px;margin-bottom:12px}
.barkod-satir{display:flex;gap:6px}
.barkod-satir input{flex:1;height:36px;padding:0 10px;border:1px solid var(--cizgi2);background:var(--zemin);font-family:var(--mono);letter-spacing:.1em;outline:none}
.dugme{height:36px;padding:0 14px;border:1px solid var(--cizgi2);background:transparent;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.dugme:hover{border-color:var(--ikincil)}
.sonuc{margin-top:12px;padding:10px 12px;border:1px solid var(--cizgi2);font-size:12.5px;display:none}
.sonuc.goster{display:block}.sonuc.uyari{border-color:var(--aksan);background:var(--aksan-zemin)}

/* Brifing modu */
.serit{position:fixed;left:0;right:0;height:0;background:#000;z-index:40;transition:height .7s cubic-bezier(.7,0,.2,1)}
.serit.u{top:0}.serit.a{bottom:0}
body.brifing .serit{height:9vh}
.sol,.alt,.ust,.dip,.sag{transition:opacity .6s}
body.brifing .sol,body.brifing .alt,body.brifing .ust,body.brifing .dip{opacity:.15;pointer-events:none}
body.brifing .hud,body.brifing .kose{opacity:0}
.br-ust{position:fixed;top:calc(9vh + 14px);left:calc(var(--sol) + 16px);z-index:41;font-family:var(--mono);font-size:11px;color:var(--ikincil);display:none;line-height:1.7;background:color-mix(in srgb,var(--zemin) 75%,transparent);padding:8px 12px 10px;border-left:2px solid var(--aksan)}
.br-ust b{color:var(--aksan);font-weight:500;letter-spacing:.12em}
.br-ilerleme{display:flex;gap:3px;margin-top:6px}
.br-ilerleme span{width:22px;height:2px;background:var(--cizgi2)}
.br-ilerleme span.tamam{background:var(--ikincil)}
.br-ilerleme span.simdi{background:var(--aksan)}
.altyazi{position:fixed;left:calc(var(--sol) + (100vw - var(--sol) - var(--sag))/2);bottom:calc(9vh + 18px);transform:translateX(-50%);z-index:41;width:min(640px,calc(100vw - var(--sol) - var(--sag) - 40px));display:none;text-align:center}
.altyazi .kim{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--aksan);margin-bottom:6px}
.altyazi p{font-size:16px;line-height:1.55;color:var(--metin);min-height:4.7em;background:color-mix(in srgb,var(--zemin) 70%,transparent);padding:8px 12px}
.br-kontrol{position:fixed;left:calc(var(--sol) + 16px);bottom:calc(9vh + 18px);z-index:42;display:none;gap:4px}
.br-kontrol button{height:30px;min-width:30px;padding:0 10px;border:1px solid var(--cizgi2);background:var(--zemin);color:var(--ikincil);font-family:var(--mono);font-size:11px;cursor:pointer}
.br-kontrol button:hover{color:var(--metin);border-color:var(--ikincil)}
body.brifing .br-ust,body.brifing .altyazi{display:block}
body.brifing .br-kontrol{display:flex}
.giris{position:fixed;inset:0;z-index:50;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;transition:opacity .9s;text-align:center;padding:16px}
.giris.acik{display:flex}
.giris .baslik{font-family:var(--sans);font-weight:600;font-size:30px;letter-spacing:.3em;color:#fff;margin-bottom:14px;min-height:1.3em}
.giris .satir{min-height:1.6em;color:#8792a2}
.giris .satir.k{color:#ff4d2e}
.imlec::after{content:"▍";animation:nabiz 1s steps(1) infinite;margin-left:2px;color:var(--aksan)}
.sansur{position:relative;display:inline-block}
.sansur::after{content:"";position:absolute;inset:-1px -2px;background:var(--metin);transform-origin:right;animation:sansur .7s cubic-bezier(.7,0,.2,1) forwards;animation-delay:var(--g,0s)}
@keyframes sansur{to{transform:scaleX(0)}}

@media (max-width:1280px){ .durum-blok{display:none} }
@media (max-width:1180px){ :root{--sag:330px} .alt{grid-template-columns:minmax(0,1fr) 380px} .logo .surum{display:none} .logo{width:auto} }
@media (max-width:767px){
  html,body{overflow:auto;height:auto}
  body{display:flex;flex-direction:column}
  .ust{position:sticky;order:0}#sahne{order:1}.dip{order:2}.sag{order:3}.sol{order:4}.alt{order:5}
  .sol>.blok:first-child{display:none}
  .logo{border-right:0}.logo .e,.komut,.sekmeler{display:none}
  .diller{margin-left:auto;border-right:0}
  #sahne{position:relative;inset:auto;height:52vh}
  .sol,.sag,.alt,.dip{position:relative;inset:auto;width:auto;height:auto;border:0;overflow:visible}
  .sag{border-top:1px solid var(--cizgi)}
  .alt{display:block}.zc{display:none}.gunluk ol{max-height:260px}
  .dip{padding:12px 16px;justify-content:flex-start;text-align:left;display:block}
  .hud.k-sag-ust,.hud.k-sag-alt,.hud.k-sol-alt{display:none}
  .alanlar{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="ust">
  <div class="logo"><span class="isaret" aria-hidden="true"></span><b>BOYKOT</b><span class="e" data-t="altBaslik"></span><span class="e surum">v0.3</span></div>
  <label class="komut"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="ara" type="search" data-t-placeholder="ara" data-t-aria-label="ara" autocomplete="off"><span class="tus">/</span></label>
  <div class="sekmeler" role="tablist">
    <button class="sekme" role="tab" aria-selected="true" data-gorunum="kure" data-t="kure"></button>
    <button class="sekme" role="tab" aria-selected="false" data-gorunum="ag" data-t="ag"></button>
    <button class="sekme" id="brifingAc" data-t="brifing"></button>
  </div>
  <div class="durum-blok"><span class="canli" data-t="cevrimici"></span><span id="saat">--:--:-- UTC</span></div>

let karaMat,sinirMat,haritaHata=false;
async function haritaKur(){
  const [kara,ulkeler,tj]=await Promise.all([
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(r=>r.json()),
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>r.json()),
    import('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm')]);
  const W=2048,H=1024,tv=document.createElement('canvas'); tv.width=W; tv.height=H;
  const c=tv.getContext('2d',{willReadFrequently:true}); c.fillStyle='#fff';
  for(const ft of tj.feature(kara,kara.objects.land).features){ const polis=ft.geometry.type==='Polygon'?[ft.geometry.coordinates]:ft.geometry.coordinates;
    for(const poli of polis){ c.beginPath(); for(const h of poli){ h.forEach(([x,y],i)=>{ const px=(x+180)/360*W,py=(90-y)/180*H; i?c.lineTo(px,py):c.moveTo(px,py); }); c.closePath(); } c.fill('evenodd'); } }
  const veri=c.getImageData(0,0,W,H).data,N=64000,poz=[],altin=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<N;i++){ const y=1-(i/(N-1))*2,lat=Math.asin(y)*180/Math.PI,lng=((i*altin)%(2*Math.PI))*180/Math.PI-180;
    const px=Math.floor((lng+180)/360*W)%W,py=Math.min(H-1,Math.floor((90-lat)/180*H));
    if(veri[(py*W+px)*4]>128){ const v=v3(lat,lng,R*1.002); poz.push(v.x,v.y,v.z); } }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(poz,3));
  karaMat=new THREE.PointsMaterial({color:css('--kara'),size:.0085,transparent:true,opacity:.9}); K.kara.add(new THREE.Points(g,karaMat));
  sinirMat=new THREE.LineBasicMaterial({color:css('--sinir'),transparent:true,opacity:.35});
  for(const hat of tj.mesh(ulkeler,ulkeler.objects.countries).coordinates){ K.sinir.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(hat.map(([x,y])=>v3(y,x,R*1.003))),sinirMat)); }
}
haritaKur().catch(()=>{ haritaHata=true; $('#hudSol').textContent=t('haritaHata'); });

const durumRengi=s=>css(DURUM[s.durum][1]);
const isaretler=[],tiklanabilir=[];
for(const s of SIRKETLER){
  const renk=new THREE.Color(durumRengi(s)),taban=v3(s.lat,s.lng,R),yon=taban.clone().normalize();
  const g=new THREE.Group(); g.position.copy(taban); g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),yon);
  const boy=.075+s.kaynak.length*.01+s.zaman.length*.01;
  const cubuk=new THREE.Mesh(new THREE.CylinderGeometry(.0022,.0022,boy,6),new THREE.MeshBasicMaterial({color:renk})); cubuk.position.y=boy/2; g.add(cubuk);
  const bas=new THREE.Mesh(new THREE.OctahedronGeometry(.011),new THREE.MeshBasicMaterial({color:renk})); bas.position.y=boy; g.add(bas);
  const ayak=new THREE.Mesh(new THREE.RingGeometry(.006,.009,4),new THREE.MeshBasicMaterial({color:renk,side:THREE.DoubleSide})); ayak.rotation.x=-Math.PI/2; ayak.rotation.z=Math.PI/4; ayak.position.y=.001; g.add(ayak);
  const halka=new THREE.Mesh(new THREE.RingGeometry(.013,.0155,48),new THREE.MeshBasicMaterial({color:renk,transparent:true,side:THREE.DoubleSide,depthWrite:false})); halka.rotation.x=-Math.PI/2; halka.position.y=.002; g.add(halka);
  const vur=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({visible:false})); vur.position.y=boy*.6; vur.userData.s=s; g.add(vur);
  K.merkez.add(g); tiklanabilir.push(vur); isaretler.push({s,g,halka,bas,faz:Math.random()});
}
const yaylar=[];
for(const s of SIRKETLER) for(const b of s.bag){
  const a=v3(s.lat,s.lng,R),bv=v3(b.lat,b.lng,R),aci=a.angleTo(bv),orta=a.clone().add(bv).normalize().multiplyScalar(R+.08+aci*.32);
  const egri=new THREE.QuadraticBezierCurve3(a,orta,bv);
  const cizgi=new THREE.Line(new THREE.BufferGeometry().setFromPoints(egri.getPoints(100)),new THREE.LineDashedMaterial({color:durumRengi(s),transparent:true,opacity:.22,dashSize:.012,gapSize:.008}));
  cizgi.computeLineDistances(); K.yay.add(cizgi);
  const isik=new THREE.Mesh(new THREE.SphereGeometry(.0065,10,10),new THREE.MeshBasicMaterial({color:durumRengi(s)})); isik.visible=false; K.yay.add(isik);
  const uc=new THREE.Mesh(new THREE.RingGeometry(.008,.011,4),new THREE.MeshBasicMaterial({color:durumRengi(s),side:THREE.DoubleSide,transparent:true,opacity:.5}));
  uc.position.copy(v3(b.lat,b.lng,R*1.003)); uc.lookAt(0,0,0); K.yay.add(uc);
  yaylar.push({s,b,egri,cizgi,isik,uc,t0:0});
}

let ucus=null,beklet=null;
const kolay=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function ucur(lat,lng,uzak=2.7){ ucus={bas:kamera.position.clone(),hedef:v3(lat,lng,1).normalize().multiplyScalar(uzak),t0:performance.now(),sure:azHareket?1:1300}; kontrol.autoRotate=false; }
kontrol.addEventListener('start',()=>{ ucus=null; kontrol.autoRotate=false; clearTimeout(beklet); });
kontrol.addEventListener('end',()=>{ clearTimeout(beklet); if(!secili&&!azHareket) beklet=setTimeout(()=>kontrol.autoRotate=true,6000); });

const isin=new THREE.Raycaster(),fare=new THREE.Vector2(); let ustunde=null,bas0=null; const ipucu=$('#ipucu');
ciz.domElement.addEventListener('pointermove',e=>{ const r=ciz.domElement.getBoundingClientRect(); fare.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  isin.setFromCamera(fare,kamera); const h=K.merkez.visible?isin.intersectObjects(tiklanabilir)[0]:null; ustunde=h&&h.object.parent.visible?h.object.userData.s:null;
  ciz.domElement.style.cursor=ustunde?'pointer':'grab';
  if(ustunde){ ipucu.textContent=ustunde.kod+'  '+ustunde.ad; ipucu.style.left=e.clientX+'px'; ipucu.style.top=e.clientY+'px'; ipucu.style.opacity=1; } else ipucu.style.opacity=0; });
ciz.domElement.addEventListener('pointerdown',e=>bas0=[e.clientX,e.clientY]);
ciz.domElement.addEventListener('pointerup',e=>{ if(bas0&&Math.hypot(e.clientX-bas0[0],e.clientY-bas0[1])<5&&ustunde) sec(ustunde.id); });
ciz.domElement.addEventListener('pointerleave',()=>{ ipucu.style.opacity=0; ustunde=null; });

function boyutla(){ const w=kap.clientWidth,h=kap.clientHeight; if(!w||!h)return; ciz.setSize(w,h); kamera.aspect=w/h;
  const yarim=Math.tan(Math.asin(R/MESAFE)),oran=Math.min(.8,.8*w/h);
  kamera.fov=2*Math.atan(yarim/oran)*180/Math.PI; kamera.updateProjectionMatrix(); agCiz(); zcCiz(); }
new ResizeObserver(boyutla).observe(kap);

const nisan=$('#nisan'),nisanEt=$('#nisanEtiket'),kEl=$('#koordinat'),gv=new THREE.Vector3(),dv=new THREE.Vector3();
function hudGuncelle(){
  gv.copy(kamera.position).normalize(); const Y=t('yonler');
  const lat=Math.asin(gv.y)*180/Math.PI; let lng=Math.atan2(gv.z,-gv.x)*180/Math.PI-180; lng=((lng+540)%360)-180;
  const d=kamera.position.length(),gor=Math.round(2*(d-R)*Math.tan(kamera.fov*Math.PI/360)*6371);
  kEl.innerHTML=`<b>${t('merkez')}</b> ${lat>=0?Y[0]:Y[1]} ${Math.abs(lat).toFixed(4)}° · ${lng>=0?Y[2]:Y[3]} ${Math.abs(lng).toFixed(4)}°<br>${t('irtifa')} ${sayiTR(Math.round((d-R)*6371))} km · ${t('gorus')} ${sayiTR(gor)} km`;
  $('#olcekYazi').textContent=sayiTR(Math.round(gor*80/kap.clientWidth/100)*100||100)+' km';
  if(secili&&K.merkez.visible){ const m=isaretler.find(x=>x.s.id===secili.id);
    m.bas.getWorldPosition(dv); const arka=dv.clone().normalize().dot(kamera.position.clone().normalize())<.15;
    dv.project(kamera); nisan.style.display=arka?'none':'block'; nisan.style.left=(dv.x+1)/2*kap.clientWidth+'px'; nisan.style.top=(1-dv.y)/2*kap.clientHeight+'px';
  } else nisan.style.display='none';
}
function dongu(z){
  if(ucus){ const k=Math.min(1,(z-ucus.t0)/ucus.sure),e=kolay(k),l=THREE.MathUtils.lerp(ucus.bas.length(),ucus.hedef.length(),e);
    kamera.position.copy(ucus.bas).normalize().lerp(ucus.hedef.clone().normalize(),e).normalize().multiplyScalar(l); if(k>=1)ucus=null; }
  kontrol.update();
  for(const m of isaretler){ const p=azHareket?.5:((z/1000*.55+m.faz)%1),sk=1+p*3; m.halka.scale.set(sk,sk,sk); m.halka.material.opacity=(1-p)*.7;
    m.bas.rotation.y=z/900; m.bas.scale.setScalar(secili?.id===m.s.id?1.6:1); }
  for(const y of yaylar){ const ak=secili?.id===y.s.id;
    y.cizgi.material.opacity=ak?.95:(secili?.08:.22); y.cizgi.material.dashSize=ak?1:.012;
    if(ak){ const k=Math.min(1,(z-y.t0)/900); y.cizgi.geometry.setDrawRange(0,Math.floor(kolay(k)*101)); y.isik.visible=k>=1; if(k>=1) y.isik.position.copy(y.egri.getPoint(((z-y.t0)/1700)%1)); y.uc.material.opacity=1; }
    else { y.cizgi.geometry.setDrawRange(0,101); y.isik.visible=false; y.uc.material.opacity=secili?.15:.5; } }
  hudGuncelle(); ciz.render(sahne,kamera); requestAnimationFrame(dongu);
}

function katmanCiz(){ $('#katmanlar').innerHTML=KATMANLAR.map(([k,a,n])=>`<label class="katman"><input type="checkbox" ${K[k].visible?'checked':''} data-k="${k}"><span>${t(a)}</span><span class="m">${n}</span></label>`).join(''); }
const hudSayCiz=()=>{ $('#hudSay').textContent=t('hudSay',{k:Object.values(K).filter(g=>g.visible).length,v:filtrele().length}); };
$('#katmanlar').addEventListener('change',e=>{ K[e.target.dataset.k].visible=e.target.checked; hudSayCiz(); });

let secili=null,sorgu='',durumF=new Set(Object.keys(DURUM)),katF=new Set(KATEGORI);
const kucuk=s=>s.toLocaleLowerCase();
const filtrele=()=>SIRKETLER.filter(s=>durumF.has(s.durum)&&katF.has(s.kategori)&&(!sorgu||kucuk([s.ad,s.ulke,s.sehir,s.kod,...s.markalar,...DILLER.map((_,i)=>KAT_AD[s.kategori][i])].join(' ')).includes(kucuk(sorgu))));
function ciplerCiz(){
  $('#durumlar').innerHTML=Object.keys(DURUM).map(k=>`<button class="cip ${DURUM[k][0]}" aria-pressed="${durumF.has(k)}" data-d="${k}"><span class="nokta"></span><span style="color:var(--ikincil)">${durumAd(k)}</span></button>`).join('');
  $('#kategoriler').innerHTML=KATEGORI.map(k=>`<button class="cip" aria-pressed="${katF.has(k)}" data-c="${k}">${B(katAd(k))}</button>`).join('');
}
const cipBagla=(el,kume,att)=>el.addEventListener('click',e=>{ const b=e.target.closest('.cip'); if(!b)return; const v=b.dataset[att]; kume.has(v)?kume.delete(v):kume.add(v); b.setAttribute('aria-pressed',kume.has(v)); tabloCiz(); });
cipBagla($('#durumlar'),durumF,'d'); cipBagla($('#kategoriler'),katF,'c');
$('#filtreSifirla').onclick=()=>{ Object.keys(DURUM).forEach(k=>durumF.add(k)); KATEGORI.forEach(k=>katF.add(k)); ciplerCiz(); tabloCiz(); };
$('#ara').addEventListener('input',e=>{ sorgu=e.target.value.trim(); tabloCiz(); });
addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){ e.preventDefault(); $('#ara').focus(); } });

function tabloCiz(){
  const l=filtrele(); $('#sayiGor').textContent=l.length+' / '+SIRKETLER.length; hudSayCiz();
  $('#liste').innerHTML=l.length?l.map(s=>`<tr class="satir" tabindex="0" data-id="${s.id}" aria-selected="${secili?.id===s.id}"><td class="kod">${s.kod.slice(4)}</td><td><div class="ad">${s.ad}</div><span class="etiket ${DURUM[s.durum][0]}"><span class="nokta"></span>${durumAd(s.durum)}</span> <span class="kod">· ${s.ulke}</span></td><td class="sag-h">${String(s.kaynak.length+s.zaman.length).padStart(2,'0')}</td></tr>`).join('')
    :`<tr><td colspan="3" style="padding:16px 12px;color:var(--ikincil);white-space:normal">${t('bos')}</td></tr>`;
  const g=new Set(l.map(s=>s.id)); isaretler.forEach(m=>m.g.visible=g.has(m.s.id)); yaylar.forEach(y=>{ const v=g.has(y.s.id); y.cizgi.visible=v; y.uc.visible=v; });
  agCiz(); zcCiz();
}
$('#liste').addEventListener('click',e=>{ const r=e.target.closest('tr[data-id]'); if(r) sec(r.dataset.id); });
$('#liste').addEventListener('keydown',e=>{ const l=filtrele(); if(!l.length)return; const i=l.findIndex(s=>s.id===secili?.id);
  if(e.key==='ArrowDown'){ e.preventDefault(); sec(l[Math.min(l.length-1,i+1)].id); } if(e.key==='ArrowUp'){ e.preventDefault(); sec(l[Math.max(0,i-1)].id); } if(e.key==='Enter'&&e.target.dataset.id) sec(e.target.dataset.id); });

/* ================= SAĞ PANEL ================= */
const alanAdi=u=>{ try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u} };
const ok='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const cubukSatir=(a,n,oran,renk='var(--metin)',monoAd=false)=>`<div class="cubuk"><span${monoAd?' class="m" style="text-align:left"':''}>${a}</span><span class="yol"><span class="dolu" style="width:${Math.min(100,oran*100)}%;background:${renk}"></span></span><span class="m">${n}</span></div>`;
function genelCiz(){

   <div class="alanlar"><div><span class="e">${t('varliklar')}</span><span class="m">${top}</span></div><div><span class="e">${t('marka')}</span><span class="m">${SIRKETLER.reduce((a,s)=>a+s.markalar.length,0)}</span></div><div><span class="e">${t('kaynak')}</span><span class="m">${SIRKETLER.reduce((a,s)=>a+s.kaynak.length,0)}</span></div></div>
   <div class="bolum"><div class="e"><span>${t('durumDagilimi')}</span><span>${top}</span></div>
     <div class="yigin">${Object.keys(DURUM).map(k=>`<span style="flex:${say(k)};background:var(${DURUM[k][1]})"></span>`).join('')}</div>
     <div class="lejant">${Object.keys(DURUM).map(k=>`<div><span class="etiket ${DURUM[k][0]}"><span class="nokta"></span><span style="color:var(--ikincil)">${durumAd(k)}</span></span><span class="m">${say(k)}</span></div>`).join('')}</div></div>
   <div class="bolum"><div class="e"><span>${t('kategori')}</span><span>${t('varliklar')}</span></div><div class="cubuklar">${kat.map(([k,n])=>cubukSatir(katAd(k),n,n/enc)).join('')}</div></div>
   <div class="bolum"><div class="e"><span>${t('merkezUlke')}</span><span>${t('varliklar')}</span></div><div class="cubuklar">${Object.entries(ulke).sort((a,b)=>b[1]-a[1]).map(([k,n])=>cubukSatir(k,n,n/top,'var(--ikincil)',true)).join('')}</div></div>

function grafikSvg(s){
  const W=352,H=170,cx=W/2,cy=H/2,dug=[...s.markalar.map(m=>['m',m]),...s.bag.map(b=>['b',L(b.e)]),...s.kaynak.map(k=>['k',alanAdi(k[1])])];
  const p=dug.map((d,i)=>{ const a=-Math.PI/2+i*2*Math.PI/dug.length; return [cx+Math.cos(a)*W*.24,cy+Math.sin(a)*H*.34,d]; });
  const sekil=(x,y,q)=>q==='m'?`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--zemin)" stroke="var(--ikincil)"/>`:q==='b'?`<rect x="${x-4}" y="${y-4}" width="8" height="8" transform="rotate(45 ${x} ${y})" fill="var(--zemin)" stroke="var(--aksan)"/>`:`<rect x="${x-3.5}" y="${y-3.5}" width="7" height="7" fill="var(--zemin)" stroke="var(--sonuk)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="display:block">
    ${p.map(([x,y,[q]])=>`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--cizgi2)" ${q==='b'?'stroke-dasharray="3 3"':''}/>`).join('')}
    ${p.map(([x,y,[q,a]])=>`${sekil(x,y,q)}<text x="${x+(x<cx-1?-8:8)}" y="${y+3.5}" text-anchor="${x<cx-1?'end':'start'}" style="font-family:var(--mono);font-size:9.5px;fill:var(--ikincil)">${a.length>20?a.slice(0,19)+'…':a}</text>`).join('')}
    <rect x="${cx-7}" y="${cy-7}" width="14" height="14" fill="var(--aksan-zemin)" stroke="var(${DURUM[s.durum][1]})"/>
    <text x="${cx}" y="${cy+22}" text-anchor="middle" style="font-family:var(--mono);font-size:10px;fill:var(--metin)">${s.kod}</text></svg>
    <div style="display:flex;gap:14px;margin-top:6px" class="e"><span>${t('lMarka')}</span><span style="color:var(--aksan)">${t('lFaaliyet')}</span><span>${t('lKaynak')}</span></div>`;
}
function dosyaCiz(s,animasyon=true){

  const guc=[[t('kaynak'),s.kaynak.length,5],[t('olaySay'),s.zaman.length,6],[t('faaliyetYeri'),s.bag.length,4],[t('ilgiliHaber'),HABERLER.filter(h=>h[3]===s.id).length,6]];

  $('#panel').innerHTML=`
   <div class="dosya-bas"><div class="ust-satir"><span class="e">${t('dosya')} · ${s.kod}</span><button class="kapat" id="kapat" aria-label="×">×</button></div>
     <h2>${s.ad}</h2><div style="margin-top:8px"><span class="etiket kutu-et ${DURUM[s.durum][0]}"><span class="nokta"></span>${B(durumAd(s.durum))}</span></div></div>
   <div class="alanlar"><div><span class="e">${t('merkezEt')}</span><span class="m">${san(s.sehir+', '+s.ulke,.15)}</span></div><div><span class="e">${t('sektor')}</span><span class="m">${san(katAd(s.kategori),.3)}</span></div><div><span class="e">${t('konum')}</span><span class="m">${san(s.lat.toFixed(2)+', '+s.lng.toFixed(2),.45)}</span></div></div>
   <div class="bolum"><div class="e"><span>${t('gerekce')}</span><span>${t('kaynagaGore')}</span></div><p class="neden" id="neden">${animasyon?'':L(s.neden)}</p></div>
   <div class="bolum"><div class="e"><span>${t('grafik')}</span><span>${s.markalar.length+s.bag.length+s.kaynak.length} ${t('dugum')}</span></div>${grafikSvg(s)}</div>
   <div class="bolum"><div class="e"><span>${t('faaliyetYerleri')}</span><span>${t('mesafe')}</span></div>${s.bag.map(b=>`<div class="cubuk" style="grid-template-columns:1fr auto"><span>${L(b.e)} <span class="m" style="color:var(--sonuk)">${b.lat.toFixed(2)}, ${b.lng.toFixed(2)}</span></span><span class="m">${sayiTR(km(s,b))} km</span></div>`).join('')}</div>
   <div class="bolum"><div class="e"><span>${t('kanit')}</span><span>${t('adet')}</span></div><div class="cubuklar">${guc.map(([a,n,mx])=>cubukSatir(a,n,n/mx)).join('')}</div></div>
   <div class="bolum"><div class="e"><span>${t('markalarUrun')}</span><span>${s.markalar.length}</span></div><div class="markalar">${s.markalar.map(m=>`<span>${m}</span>`).join('')}</div></div>
   <div class="bolum"><div class="e"><span>${t('olaySirasi')}</span><span>${s.zaman.length}</span></div><ol class="zaman">${s.zaman.map(([z,o])=>`<li><time>${z}</time><i></i><span>${L(o)}</span></li>`).join('')}</ol></div>
   <div class="bolum"><div class="e"><span>${t('kaynaklar')}</span><span>${s.kaynak.length}</span></div><ul class="kaynaklar">${s.kaynak.map(([b,u,z],i)=>`<li><a href="${u}" target="_blank" rel="noopener"><span class="m">[${i+1}]</span><span>${L(b)}<br><span class="m">${alanAdi(u)} · ${z}</span></span>${ok}</a></li>`).join('')}</ul></div>
   <div class="dipnot">${t('dayanir')} <a href="${issue}" target="_blank" rel="noopener">${t('hataBildir')}</a></div>`;
  $('#kapat').onclick=()=>br.acik?brifingBitir():birak();
  if(animasyon) yaz($('#neden'),L(s.neden),10);
}

/* ================= AĞ ================= */
let gorunum='kure';
function agCiz(){
  if(gorunum!=='ag')return; const el=$('#ag'),W=el.clientWidth,H=el.clientHeight; if(!W)return;
  const l=filtrele(),cx=W/2,cy=H/2,R1=Math.min(W,H)*.17,R2=Math.min(W,H)*.36;
  const kats=KATEGORI.filter(k=>l.some(s=>s.kategori===k)),kp={},sp={};
  kats.forEach((k,i)=>{ const a=-Math.PI/2+i*2*Math.PI/kats.length; kp[k]=[cx+Math.cos(a)*R1,cy+Math.sin(a)*R1]; });
  l.forEach((s,i)=>{ const a=-Math.PI/2+i*2*Math.PI/l.length; sp[s.id]=[cx+Math.cos(a)*R2,cy+Math.sin(a)*R2,a]; });
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img"><circle cx="${cx}" cy="${cy}" r="${R1}" fill="none" stroke="var(--cizgi)" stroke-dasharray="2 4"/><circle cx="${cx}" cy="${cy}" r="${R2}" fill="none" stroke="var(--cizgi)" stroke-dasharray="2 4"/>`;
  for(const s of l){ const [x,y]=sp[s.id],[kx,ky]=kp[s.kategori],ak=secili?.id===s.id;
    svg+=`<path d="M${kx},${ky} Q${cx},${cy} ${x},${y}" fill="none" stroke="${ak?css(DURUM[s.durum][1]):'var(--cizgi2)'}" stroke-width="${ak?1.5:1}" opacity="${secili&&!ak?.4:1}"/>`; }
  for(const k of kats){ const [x,y]=kp[k]; svg+=`<g><rect x="${x-5}" y="${y-5}" width="10" height="10" fill="var(--zemin)" stroke="var(--ikincil)"/><text x="${x}" y="${y-12}" text-anchor="middle" style="font-family:var(--mono);font-size:10px;fill:var(--ikincil);letter-spacing:1px">${B(katAd(k))}</text></g>`; }
  for(const s of l){ const [x,y,a]=sp[s.id],sag=Math.cos(a)>=0,ak=secili?.id===s.id,r=css(DURUM[s.durum][1]);
    svg+=`<g class="ag-dugum" data-id="${s.id}"><circle cx="${x}" cy="${y}" r="${ak?9:6}" fill="var(--zemin)" stroke="${r}" stroke-width="${ak?2:1.2}"/><circle cx="${x}" cy="${y}" r="2.5" fill="${r}"/>
      <text x="${x+(sag?14:-14)}" y="${y-2}" text-anchor="${sag?'start':'end'}" style="font-family:var(--sans);font-size:12.5px;fill:var(--metin)">${s.ad}</text><text x="${x+(sag?14:-14)}" y="${y+12}" text-anchor="${sag?'start':'end'}">${s.kod} · ${s.ulke}</text></g>`; }
  el.innerHTML=svg+'</svg>';
}
$('#ag').addEventListener('click',e=>{ const g=e.target.closest('.ag-dugum'); if(g) sec(g.dataset.id); });
const gorunumAdCiz=()=>{ $('#gorunumAd').textContent=t(gorunum==='kure'?'gorunumKure':'gorunumAg'); };
document.querySelectorAll('.sekme[data-gorunum]').forEach(b=>b.onclick=()=>{ gorunum=b.dataset.gorunum; document.querySelectorAll('.sekme[data-gorunum]').forEach(x=>x.setAttribute('aria-selected',x===b));
  $('#kure').style.display=gorunum==='kure'?'block':'none'; $('#ag').style.display=gorunum==='ag'?'block':'none'; gorunumAdCiz();
  document.querySelectorAll('.k-sag-ust,.k-sag-alt').forEach(x=>x.style.visibility=gorunum==='kure'?'visible':'hidden'); agCiz(); });

/* ================= ZAMAN ÇİZELGESİ ================= */
const tarihYil=z=>{ const [y,m]=z.split('-').map(Number); return y+((m||6)-1)/12; };
function zcCiz(){
  const el=$('#zc'),W=el.clientWidth,H=el.clientHeight; if(!W||!H)return;
  const l=filtrele(),y0=2016,y1=2027,pad=16,sol=52,x=y=>sol+(y-y0)/(y1-y0)*(W-sol-pad);
  const satir=(H-26)/Math.max(1,l.length),simdi=2026+10.4/12;
  let s=`<g class="eksen">`; for(let y=y0;y<y1;y++){ s+=`<line x1="${x(y)}" y1="0" x2="${x(y)}" y2="${H-18}" stroke="var(--cizgi)"/><text x="${x(y)+4}" y="${H-5}">${y}</text>`; } s+='</g>';
  s+=`<line x1="${x(simdi)}" y1="0" x2="${x(simdi)}" y2="${H-18}" stroke="var(--aksan)" stroke-dasharray="2 3"/><text x="${x(simdi)-4}" y="${H-5}" text-anchor="end" style="font-family:var(--mono);font-size:10px;fill:var(--aksan)">${t('simdi')}</text>`;
  let say=0;
  l.forEach((sr,i)=>{ const yy=6+i*satir+satir/2,ak=secili?.id===sr.id,r=css(DURUM[sr.durum][1]),yillar=sr.zaman.map(z=>tarihYil(z[0]));
    s+=`<line x1="${x(Math.min(...yillar))}" y1="${yy}" x2="${sr.durum==='sonuc'?x(Math.max(...yillar)):x(simdi)}" y2="${yy}" stroke="${r}" stroke-opacity="${ak?.9:.3}" stroke-width="${ak?2:1}"/>`;
    s+=`<text x="${pad-4}" y="${yy+3}" style="font-family:var(--mono);font-size:9.5px;fill:${ak?'var(--metin)':'var(--sonuk)'}">${sr.kod.slice(4)}</text>`;
    for(const [z,o] of sr.zaman){ const xx=x(tarihYil(z)); say++;
      s+=`<g class="tik" data-id="${sr.id}"><title>${z} · ${sr.ad}: ${L(o)}</title><rect x="${xx-4}" y="${yy-4}" width="8" height="8" transform="rotate(45 ${xx} ${yy})" fill="${ak?r:'var(--zemin)'}" stroke="${r}"/></g>`; }
    for(const h of HABERLER.filter(h=>h[3]===sr.id)){ const xx=x(tarihYil(h[0].slice(0,7))); s+=`<line x1="${xx}" y1="${yy-6}" x2="${xx}" y2="${yy+6}" stroke="${r}"/>`; }
  });
  el.setAttribute('viewBox',`0 0 ${W} ${H}`); el.innerHTML=s; $('#zcSay').textContent=say+' '+t('olay');
}
$('#zc').addEventListener('click',e=>{ const g=e.target.closest('.tik'); if(g) sec(g.dataset.id); });

/* ================= OLAY GÜNLÜĞÜ ================= */
function gunlukCiz(ilk=false){
  const olaylar=[...HABERLER.map(h=>({z:h[0],tur:'haber',id:h[3],m:`${h[2]} · ${h[1]}`})),...SIRKETLER.flatMap(s=>s.zaman.map(([z,o])=>({z:z+'-01T00:00',tur:'kayit',id:s.id,m:`${s.ad}: ${L(o)}`})))].sort((a,b)=>b.z.localeCompare(a.z));
  $('#gunluk').innerHTML=olaylar.map((o,i)=>`<li data-id="${o.id}" class="${ilk&&i<2?'yeni':''}"><span>${o.z.slice(0,10)}</span><span class="tur ${o.tur==='haber'?'h':''}">${t(o.tur)}</span><span>${o.m}</span></li>`).join('');
}
$('#gunluk').addEventListener('click',e=>{ const li=e.target.closest('li'); if(li) sec(li.dataset.id); });

/* ================= SEÇİM ================= */
function nisanCiz(s){ const b=s.bag[0]; nisanEt.innerHTML=`<b>${B(s.ad)}</b><br>${s.kod} · ${s.sehir}<br>${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}<br><span style="color:var(--aksan)">→ ${L(b.e)} · ${sayiTR(km(s,b))} km</span>`; }
function sec(id){
  const s=SIRKETLER.find(x=>x.id===id); if(!s)return; const yeni=secili?.id!==id; secili=s; tabloCiz(); dosyaCiz(s);
  $('#liste').querySelector(`[data-id="${id}"]`)?.scrollIntoView({block:'nearest'});
  const b=s.bag[0]; ucur((s.lat+b.lat)/2,(s.lng+b.lng)/2,2.25+Math.min(1.1,km(s,b)/6000));
  yaylar.forEach(y=>{ if(y.s.id===id) y.t0=performance.now(); });
  nisanCiz(s); if(yeni){ Ses.cal('vin'); setTimeout(()=>Ses.cal('kilit'),650); }
}
function birak(){ secili=null; tabloCiz(); genelCiz(); if(!azHareket) kontrol.autoRotate=true; }

/* ================= SES MOTORU (Web Audio; dosya yok, her şey üretilir) ================= */
const Ses=(()=>{
  let ctx=null,ana,muzikBus,efektBus,yanki,dronSuz,acik=false,zamanlayici=null,adim=0,sonraki=0,yogun=false,akor=0;
  const ON6=60/92/4;
  const KARANLIK=[[38,41,45,48],[34,38,41,45],[31,34,38,41],[33,37,40,43]];      /* Re min · Si♭ · Sol min · La */
  const KAHRAMAN=[[38,45,50,53],[34,46,50,53],[29,45,48,53],[36,43,48,52]];      /* Re min → Si♭ → Fa → Do */
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function kur(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const sik=ctx.createDynamicsCompressor(); sik.threshold.value=-18; sik.ratio.value=4; sik.connect(ctx.destination);
    ana=ctx.createGain(); ana.gain.value=0; ana.connect(sik);
    muzikBus=ctx.createGain(); muzikBus.gain.value=.32; muzikBus.connect(ana);
    efektBus=ctx.createGain(); efektBus.gain.value=.55; efektBus.connect(ana);
    yanki=ctx.createConvolver(); const uz=ctx.sampleRate*2.8,ir=ctx.createBuffer(2,uz,ctx.sampleRate);
    for(let k=0;k<2;k++){ const d=ir.getChannelData(k); for(let i=0;i<uz;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/uz,3.2); }
    yanki.buffer=ir; const yG=ctx.createGain(); yG.gain.value=.35; yanki.connect(yG); yG.connect(ana);
    dronSuz=ctx.createBiquadFilter(); dronSuz.type='lowpass'; dronSuz.frequency.value=180; dronSuz.Q.value=6;
    const dg=ctx.createGain(); dg.gain.value=.22; dronSuz.connect(dg); dg.connect(muzikBus);
    [[26,-6],[26,7],[33,0]].forEach(([m,d])=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=hz(m); o.detune.value=d; o.connect(dronSuz); o.start(); });
    const lfo=ctx.createOscillator(),lg=ctx.createGain(); lfo.frequency.value=.07; lg.gain.value=90; lfo.connect(lg); lg.connect(dronSuz.frequency); lfo.start();
  }
  const gurultu=sure=>{ const b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*sure),ctx.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; return s; };
  const zarf=(g,z,a,tepe,b)=>{ g.gain.setValueAtTime(0,z); g.gain.linearRampToValueAtTime(tepe,z+a); g.gain.exponentialRampToValueAtTime(.0001,z+a+b); };
  function ped(z,notalar){ const sure=ON6*32,suz=ctx.createBiquadFilter(),g=ctx.createGain(); suz.type='lowpass'; suz.frequency.setValueAtTime(400,z); suz.frequency.linearRampToValueAtTime(1100,z+4); suz.frequency.linearRampToValueAtTime(500,z+sure);
    g.gain.setValueAtTime(0,z); g.gain.linearRampToValueAtTime(.05,z+2.2); g.gain.setValueAtTime(.05,z+sure-1.2); g.gain.linearRampToValueAtTime(0,z+sure);
    suz.connect(g); g.connect(muzikBus); g.connect(yanki);
    notalar.forEach(m=>[-8,8].forEach(d=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=hz(m+12); o.detune.value=d; o.connect(suz); o.start(z); o.stop(z+sure+.1); })); }
  /* Bakır nefesli benzeri ses: testere yığını, süzgeç yavaşça açılır (şişme) */
  function boru(z,notalar,sure,tepe=.07){ const suz=ctx.createBiquadFilter(),g=ctx.createGain(); suz.type='lowpass'; suz.Q.value=2;
    suz.frequency.setValueAtTime(350,z); suz.frequency.linearRampToValueAtTime(1800,z+sure*.45); suz.frequency.linearRampToValueAtTime(700,z+sure);
    g.gain.setValueAtTime(0,z); g.gain.linearRampToValueAtTime(tepe,z+sure*.35); g.gain.linearRampToValueAtTime(tepe*.6,z+sure*.9); g.gain.linearRampToValueAtTime(0,z+sure+.05);
    suz.connect(g); g.connect(muzikBus); g.connect(yanki);
    notalar.forEach((m,i)=>[-6,0,6].forEach(d=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=hz(m+(i?12:0)); o.detune.value=d; o.connect(suz); o.start(z); o.stop(z+sure+.1); })); }
  function bas(z,m,v){ const o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.createBiquadFilter(); o.type='square'; o.frequency.value=hz(m); s.type='lowpass'; s.frequency.setValueAtTime(600,z); s.frequency.exponentialRampToValueAtTime(90,z+.18);
    o.connect(s); s.connect(g); g.connect(muzikBus); zarf(g,z,.004,v,.2); o.start(z); o.stop(z+.25); }
  function tikirti(z,v){ const n=gurultu(.04),s=ctx.createBiquadFilter(),g=ctx.createGain(); s.type='highpass'; s.frequency.value=7000; n.connect(s); s.connect(g); g.connect(muzikBus); zarf(g,z,.001,v,.035); n.start(z); }
  function davul(z,v=.5){ const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.setValueAtTime(110,z); o.frequency.exponentialRampToValueAtTime(38,z+.35); o.connect(g); g.connect(muzikBus); g.connect(yanki); zarf(g,z,.003,v,.45); o.start(z); o.stop(z+.5); }
  function sonar(z){ const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=hz(81); o.connect(g); g.connect(yanki); g.connect(muzikBus); zarf(g,z,.005,.06,1.4); o.start(z); o.stop(z+1.5); }
  function planla(){
    while(sonraki<ctx.currentTime+.12){
      const z=sonraki,olcu=Math.floor(adim/16),ici=adim%16;
      if(!yogun){ if(adim%128===0){ akor=(olcu/8)%KARANLIK.length; ped(z,KARANLIK[akor]); } }
      else {
        const k=KAHRAMAN[Math.floor(olcu/2)%KAHRAMAN.length];
        if(adim%32===0) boru(z,k,ON6*32);
        if(ici%2===0) bas(z,k[0]-12+(ici===6||ici===14?12:0),ici%4===0?.15:.08);
        tikirti(z,ici%4===2?.05:.018);
        if(ici===0||ici===8) davul(z);
        if(olcu%4===3&&ici>=12) davul(z,.22);
      }
      if(ici===0&&olcu%4===3) sonar(z+ON6*8);
      adim++; sonraki+=ON6; }
  }
  const E={
    tik(){ const z=ctx.currentTime,n=gurultu(.012),s=ctx.createBiquadFilter(),g=ctx.createGain(); s.type='bandpass'; s.frequency.value=2600+Math.random()*1800; s.Q.value=3; n.connect(s); s.connect(g); g.connect(efektBus); zarf(g,z,.001,.12,.01); n.start(z); },
    blip(f=1300){ const z=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.setValueAtTime(f,z); o.frequency.exponentialRampToValueAtTime(f*.7,z+.06); o.connect(g); g.connect(efektBus); zarf(g,z,.002,.12,.07); o.start(z); o.stop(z+.1); },
    kilit(){ const z=ctx.currentTime; [[1400,0],[1400,.09],[2100,.18]].forEach(([f,d])=>{ const o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.createBiquadFilter(); o.type='square'; o.frequency.value=f; s.type='lowpass'; s.frequency.value=3000; o.connect(s); s.connect(g); g.connect(efektBus); zarf(g,z+d,.002,.05,.05); o.start(z+d); o.stop(z+d+.08); }); },
    vin(){ const z=ctx.currentTime,n=gurultu(1.4),s=ctx.createBiquadFilter(),g=ctx.createGain(); s.type='bandpass'; s.Q.value=1.4; s.frequency.setValueAtTime(300,z); s.frequency.exponentialRampToValueAtTime(2400,z+.7); s.frequency.exponentialRampToValueAtTime(500,z+1.3);
      n.connect(s); s.connect(g); g.connect(efektBus); g.gain.setValueAtTime(0,z); g.gain.linearRampToValueAtTime(.16,z+.6); g.gain.linearRampToValueAtTime(0,z+1.35); n.start(z); },
    darbe(){ const z=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.setValueAtTime(90,z); o.frequency.exponentialRampToValueAtTime(28,z+1.2); o.connect(g); g.connect(efektBus); g.connect(yanki); zarf(g,z,.005,.9,1.6); o.start(z); o.stop(z+1.8);
      const n=gurultu(.5),s=ctx.createBiquadFilter(),g2=ctx.createGain(); s.type='lowpass'; s.frequency.value=900; n.connect(s); s.connect(g2); g2.connect(yanki); g2.connect(efektBus); zarf(g2,z,.002,.35,.4); n.start(z); },
    ust(){ const z=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=2400; o.connect(g); g.connect(efektBus); zarf(g,z,.001,.025,.02); o.start(z); o.stop(z+.03); },
    /* Zafer vurgusu: Fa majörden Do majöre yükselen bakır + davul gümbürtüsü */
    zafer(){ const z=ctx.currentTime+.05; boru(z,[41,53,57,60],1.1,.11); boru(z+1.0,[36,52,55,60],2.6,.13); [0,.12,.24,.36,.5].forEach((d,i)=>davul(z+.6+d,.18+i*.06)); davul(z+1.0,.7); },
    final(){ const z=ctx.currentTime+.05; boru(z,[34,50,53,58],1.4,.1); boru(z+1.3,[36,52,55,60],1.4,.12); boru(z+2.6,[29,53,57,60],4.5,.15); [0,.1,.2,.3,.4,.5,.6].forEach((d,i)=>davul(z+2.0+d,.15+i*.05)); davul(z+2.6,.8); }
  };
  return {
    get acik(){return acik},
    async ac(){ if(!ctx) kur(); await ctx.resume(); acik=true; ana.gain.cancelScheduledValues(ctx.currentTime); ana.gain.setValueAtTime(ana.gain.value,ctx.currentTime); ana.gain.linearRampToValueAtTime(.9,ctx.currentTime+1.2);
      if(!zamanlayici){ sonraki=ctx.currentTime+.05; zamanlayici=setInterval(planla,25); } sesDugmeCiz(); try{localStorage.setItem('ses','1')}catch(e){} },
    kapat(){ if(!ctx)return; acik=false; ana.gain.cancelScheduledValues(ctx.currentTime); ana.gain.setValueAtTime(ana.gain.value,ctx.currentTime); ana.gain.linearRampToValueAtTime(0,ctx.currentTime+.4);
      setTimeout(()=>{ if(!acik){ clearInterval(zamanlayici); zamanlayici=null; ctx.suspend(); } },500); sesDugmeCiz(); try{localStorage.setItem('ses','0')}catch(e){} },
    yogunluk(v){ if(yogun!==v){ yogun=v; adim=Math.ceil(adim/32)*32; } if(ctx) dronSuz.Q.setTargetAtTime(v?10:6,ctx.currentTime,.5); },
    cal(ad,...a){ if(acik&&ctx&&E[ad]) E[ad](...a); }
  };
})();
function sesDugmeCiz(){ const b=$('#sesDugme'),a=Ses.acik,et=t(a?'sesKapat':'sesAc'); b.setAttribute('aria-pressed',a); b.setAttribute('aria-label',et); b.title=et;
  b.querySelector('.dalga').style.display=a?'':'none'; b.querySelector('.sessiz').style.display=a?'none':''; b.style.color=a?'var(--metin)':''; }
$('#sesDugme').onclick=()=>Ses.acik?Ses.kapat():Ses.ac();
document.addEventListener('click',e=>{ if(e.target.closest('.sekme[data-gorunum],.cip,.katman,.dil,#barkodAc,#yontemAc,#temaDugme,.br-kontrol button,.kapat')) Ses.cal('blip'); },true);
let sonUst=null; setInterval(()=>{ if(ustunde&&ustunde!==sonUst) Ses.cal('ust'); sonUst=ustunde; },60);

/* ================= DAKTİLO ================= */
const yazJeton=new WeakMap();
function yaz(el,metin,hiz=22,sesli=false){ return new Promise(res=>{ if(!el)return res(); if(azHareket){ el.textContent=metin; return res(); }
  const j={}; yazJeton.set(el,j); el.textContent=''; el.classList.add('imlec'); let i=0;
  const adim=()=>{ if(yazJeton.get(el)!==j){ el.classList.remove('imlec'); return res(); } i+=metin[i]===' '?2:1; el.textContent=metin.slice(0,i); if(sesli&&i%2===0&&metin[i-1]!==' ') Ses.cal('tik');
    if(i<metin.length) setTimeout(adim,hiz); else { el.classList.remove('imlec'); res(); } }; adim(); }); }

/* ================= BRİFİNG ================= */
const bekle=ms=>new Promise(r=>setTimeout(r,ms));
const br={acik:false,i:0,dur:false,zaman:null,jeton:0};
async function brifingBaslat(){
  if(br.acik)return; br.acik=true; br.i=0; br.dur=false; $('#brDur').textContent='❚❚'; const j=++br.jeton;
  /* Brifing bir tıklamayla başlar; ses daha önce bilerek kapatılmadıysa açılır */
  let tercih=null; try{tercih=localStorage.getItem('ses')}catch(e){} if(tercih!=='0') Ses.ac();
  if(gorunum!=='kure') document.querySelector('[data-gorunum="kure"]').click();
  const g=$('#giris'); g.style.opacity=1; g.classList.add('acik'); $('#gBaslik').textContent='BOYKOT'; ['g1','g2','g3'].forEach(x=>$('#'+x).textContent='');
  await bekle(400); await yaz($('#g1'),t('g1',{d:new Date().toISOString().slice(0,10)}),22,true); if(j!==br.jeton)return;
  await yaz($('#g2'),t('g2',{n:SIRKETLER.length,u:new Set(SIRKETLER.map(s=>s.ulke)).size,b:yaylar.length}),22,true); if(j!==br.jeton)return;
  await yaz($('#g3'),t('g3'),22,true); if(j!==br.jeton)return;
  Ses.cal('darbe'); Ses.yogunluk(true); await bekle(1100); if(j!==br.jeton)return;
  g.style.opacity=0; document.body.classList.add('brifing'); kontrol.autoRotate=false;
  await bekle(900); g.classList.remove('acik'); if(j!==br.jeton)return;
  brAdim();
}
function brUstCiz(){ const s=SIRKETLER[br.i];
  $('#brUst').innerHTML=`<b>${t('brifingNo')} ${String(br.i+1).padStart(2,'0')} / ${String(SIRKETLER.length).padStart(2,'0')}</b><br>${s.kod} · ${B(s.ad)} · ${s.sehir}, ${s.ulke}<div class="br-ilerleme">${SIRKETLER.map((_,k)=>`<span class="${k<br.i?'tamam':k===br.i?'simdi':''}"></span>`).join('')}</div>`; }
async function brAdim(){
  clearTimeout(br.zaman); const j=++br.jeton,s=SIRKETLER[br.i]; sec(s.id); brUstCiz();
  $('#brKim').textContent=`${s.kod} · ${B(durumAd(s.durum))}`; $('#brMetin').textContent='';
  const b=s.bag[0],metin=t('adimMetin',{ad:s.ad,sehir:s.sehir,neden:L(s.neden),yer:L(b.e),km:sayiTR(km(s,b))});
  await bekle(1100); if(j!==br.jeton)return;
  await yaz($('#brMetin'),metin,dil==='zh'?60:24,true); if(j!==br.jeton)return;
  /* Boykotun sonuç aldığı yerde zafer anı */
  if(s.durum==='sonuc'){ Ses.cal('zafer'); $('#brKim').innerHTML=`<span style="color:var(--basari)">${s.kod} · ${t('basarili')}</span>`; }
  br.zaman=setTimeout(()=>{ if(!br.dur&&j===br.jeton) brSonraki(); },s.durum==='sonuc'?4600:3400);
}
function brSonraki(){ if(!br.acik)return; if(br.i<SIRKETLER.length-1){ br.i++; brAdim(); } else brifingFinal(); }
function brOnceki(){ if(br.acik&&br.i>0){ br.i--; brAdim(); } }
/* Kapanış: sayılar uydurma değil, veriden hesaplanır */
async function brifingFinal(){
  const j=++br.jeton; clearTimeout(br.zaman); const g=$('#giris'); g.classList.add('acik'); g.style.opacity=0; await bekle(30); g.style.opacity=1;
  ['gBaslik','g1','g2','g3'].forEach(x=>$('#'+x).textContent='');
  const sonuc=SIRKETLER.filter(s=>s.durum==='sonuc'); Ses.yogunluk(false); Ses.cal('final');
  await bekle(700); await yaz($('#gBaslik'),t('bitti'),40,true); if(j!==br.jeton)return;
  await yaz($('#g1'),t('f1',{n:SIRKETLER.length,s:sonuc.length}),22,true); if(j!==br.jeton)return;
  if(sonuc.length){ await yaz($('#g2'),t('f2',{l:sonuc.map(s=>B(s.ad)).join(t('ve'))}),22,true); if(j!==br.jeton)return; }
  await yaz($('#g3'),t('f3'),30,true); await bekle(3200); if(j!==br.jeton)return;
  brifingBitir();
}
function brifingBitir(){ if(!br.acik)return; br.acik=false; br.jeton++; clearTimeout(br.zaman); Ses.yogunluk(false); document.body.classList.remove('brifing');
  $('#giris').style.opacity=0; setTimeout(()=>{ if(!br.acik) $('#giris').classList.remove('acik'); },900); $('#brMetin').textContent=''; birak();
  ucus={bas:kamera.position.clone(),hedef:new THREE.Vector3(.9,.75,3.2).setLength(MESAFE),t0:performance.now(),sure:1200}; }
$('#brifingAc').onclick=brifingBaslat; $('#brIleri').onclick=brSonraki; $('#brGeri').onclick=brOnceki; $('#brCik').onclick=brifingBitir;
$('#brDur').onclick=()=>{ br.dur=!br.dur; $('#brDur').textContent=br.dur?'▶':'❚❚'; if(!br.dur){ clearTimeout(br.zaman); br.zaman=setTimeout(brSonraki,1200); } };
addEventListener('keydown',e=>{ if(!br.acik)return; if(e.key==='ArrowRight')brSonraki(); if(e.key==='ArrowLeft')brOnceki(); if(e.key===' '){ e.preventDefault(); $('#brDur').click(); } },true);

/* ================= TEMA, MODALLAR, BARKOD ================= */
$('#temaDugme').onclick=()=>{ kok.dataset.tema=kok.dataset.tema==='acik'?'':'acik'; try{localStorage.setItem('tema',kok.dataset.tema)}catch(e){}
  okyanus.material.color.set(css('--zemin')); atmMat.uniforms.renk.value.set(css('--atmosfer')); atmKarisim();
  izMat.color.set(css('--kara')); izMat2.color.set(css('--kara')); karaMat?.color.set(css('--kara')); sinirMat?.color.set(css('--sinir'));
  isaretler.forEach(m=>m.g.traverse(o=>o.material?.color?.set(durumRengi(m.s))));
  yaylar.forEach(y=>{ const r=durumRengi(y.s); y.cizgi.material.color.set(r); y.isik.material.color.set(r); y.uc.material.color.set(r); });
  agCiz(); zcCiz(); };
const ac=id=>{ $(id).classList.add('acik'); $(id).querySelector('input,button')?.focus(); };
$('#barkodAc').onclick=()=>ac('#barkodModal'); $('#yontemAc').onclick=()=>ac('#yontemModal'); $('#yasalAc').onclick=e=>{e.preventDefault();ac('#yontemModal')};
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m||e.target.closest('[data-kapat]')) m.classList.remove('acik'); }));
addEventListener('keydown',e=>{ if(e.key==='Escape'){ const m=document.querySelector('.modal.acik'); if(m) m.classList.remove('acik'); else if(br.acik) brifingBitir(); else if(secili) birak(); } });
const ean13=k=>{ if(!/^\d{13}$/.test(k))return false; const top=[...k.slice(0,12)].reduce((a,d,i)=>a+ +d*(i%2?3:1),0); return (10-top%10)%10=== +k[12]; };
function barkodSor(){ const k=$('#barkod').value.replace(/\D/g,''),o=$('#barkodSonuc'); o.className='sonuc goster';
  if(k.length!==13){ o.textContent=t('bk13'); return; }
  if(!ean13(k)){ o.textContent=t('bkHane'); return; }
  if(k.startsWith('729')){ o.classList.add('uyari'); o.innerHTML=t('bk729'); Ses.cal('kilit'); }
  else o.innerHTML=t('bkTemiz',{p:`<span class="m">${k.slice(0,3)}</span>`}); }
$('#barkodSor').onclick=barkodSor; $('#barkod').addEventListener('keydown',e=>{ if(e.key==='Enter') barkodSor(); });

/* ================= DİL UYGULA ================= */
function dilUygula(){
  kok.lang=dil==='zh'?'zh-CN':dil;
  document.title='Boykot · '+t('altBaslik');
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('[data-t-placeholder]').forEach(el=>el.placeholder=t(el.dataset.tPlaceholder));
  document.querySelectorAll('[data-t-aria-label]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.tAriaLabel)));
  document.querySelectorAll('[data-t-title]').forEach(el=>el.title=t(el.dataset.tTitle));
  document.querySelectorAll('.dil').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dil===dil));
  if(haritaHata) $('#hudSol').textContent=t('haritaHata');
  katmanCiz(); ciplerCiz(); gorunumAdCiz(); sesDugmeCiz(); tabloCiz(); gunlukCiz();
  if(secili){ dosyaCiz(secili,false); nisanCiz(secili); } else genelCiz();
  if(br.acik&&!$('#giris').classList.contains('acik')){ brUstCiz(); const s=SIRKETLER[br.i]; $('#brKim').textContent=`${s.kod} · ${B(durumAd(s.durum))}`; $('#brMetin').textContent=t('adimMetin',{ad:s.ad,sehir:s.sehir,neden:L(s.neden),yer:L(s.bag[0].e),km:sayiTR(km(s,s.bag[0]))}); }
  if($('#barkodSonuc').classList.contains('goster')) barkodSor();
}
document.querySelectorAll('.dil').forEach(b=>b.onclick=()=>{ dil=b.dataset.dil; try{localStorage.setItem('dil',dil)}catch(e){} dilUygula(); });

dilUygula(); gunlukCiz(true); boyutla();
</script>
