<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boykot · Küresel Gözlem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --zemin:#070908; --yuzey:#0a0d0b; --yuzey2:#101511; --cizgi:#1a211c; --cizgi2:#2b352d; --izgara:rgba(130,150,135,.04);
  --metin:#d9ded7; --ikincil:#9aa598; --sonuk:#66736a;
  --aksan:#e04a32; --bds:#e04a32; --baski:#d99b2f; --halk:#c8bd4e; --sonuc:#3fae74;
  --bds-zemin:rgba(224,74,50,.08); --sari:#d99b2f; --basari:#3fae74; --gri:#c8bd4e;
  --kara:#5d6f62; --sinir:#405346;
  --sans:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif; --mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,monospace;
  --ust:44px; --sol:300px; --sag:380px; --alt:176px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--zemin);color:var(--metin);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.m{font-family:var(--mono);font-feature-settings:"zero" 1}
.e{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sonuk)}
:lang(zh) .e{letter-spacing:.08em}
:focus-visible{outline:2px solid var(--metin);outline-offset:2px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--cizgi2)}::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--cizgi2) transparent}

/* ---- İskelet: ızgara zemin üzerinde yüzen paneller ---- */
:root{--g:8px;--r:0px;--r2:2px;--golge:none;--kc:var(--cizgi2)}
body{background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
  linear-gradient(var(--izgara) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,var(--izgara) 1px,transparent 1px) 0 0/32px 32px,
  radial-gradient(ellipse 70% 60% at 50% 42%,var(--yuzey) 0,var(--zemin) 75%) fixed}
body::after{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.22}
.ust{position:fixed;inset:0 0 auto 0;height:var(--ust);display:flex;align-items:center;gap:8px;padding:0 var(--g);z-index:10;background:color-mix(in srgb,var(--zemin) 94%,transparent);border-bottom:1px solid var(--cizgi)}
.ust>*{display:flex;align-items:center}
.logo{gap:10px;width:calc(var(--sol) - 2*var(--g));padding:0 4px;flex:none}
.logo b{font-family:var(--mono);font-weight:600;letter-spacing:.3em;font-size:12px}
.logo .surum{margin-left:auto}
.isaret{width:7px;height:7px;background:var(--metin);transform:rotate(45deg)}
.komut{flex:1;max-width:520px;height:30px;gap:10px;padding:0 6px 0 10px;border:1px solid var(--cizgi);border-radius:var(--r2);background:var(--yuzey);color:var(--sonuk);cursor:text;min-width:0;transition:border-color .15s}
.komut:focus-within{border-color:var(--cizgi2)}
.komut input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-family:var(--mono);font-size:12px;color:var(--metin)}
.komut input::placeholder{color:var(--sonuk)}
.tus{font-family:var(--mono);font-size:10px;border:1px solid var(--cizgi2);border-radius:var(--r2);padding:0 5px;color:var(--sonuk)}
.sekmeler{gap:2px;padding:3px;margin-left:auto;border:1px solid var(--cizgi);border-radius:var(--r2);background:var(--yuzey)}
.sekme{height:26px;padding:0 12px;border:0;border-radius:var(--r2);background:transparent;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--sonuk);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center}
.sekme:hover{color:var(--metin)}
.sekme[aria-selected="true"]{color:var(--metin);background:var(--yuzey2);box-shadow:inset 0 -1px var(--metin)}
#brifingAc{color:var(--metin)}
.durum-blok{gap:14px;padding:0 6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ikincil);white-space:nowrap}
.canli{display:flex;align-items:center;gap:6px}
.canli::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--sonuc);animation:nabiz 2s infinite}
@keyframes nabiz{50%{opacity:.3}}
.diller{gap:0}
.dil{height:28px;padding:0 7px;border:0;border-radius:var(--r2);background:transparent;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--sonuk);cursor:pointer}
.dil[aria-pressed="true"]{color:var(--metin);background:var(--yuzey2)}
.dil:hover{color:var(--metin)}
.ikonlar{gap:2px}
.ik{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:var(--r2);background:transparent;color:var(--ikincil);cursor:pointer}
.ik:hover{background:var(--yuzey2);color:var(--metin)}
.ik svg{width:16px;height:16px}

.sol,.sag,.alt{position:fixed;z-index:5;border:1px solid var(--cizgi);border-radius:0;background:
  repeating-linear-gradient(90deg,color-mix(in srgb,var(--ikincil) 26%,transparent) 0 1px,transparent 1px 12px) 0 0/12px 4px repeat-x,
  linear-gradient(var(--kc),var(--kc)) 0 0/12px 1px no-repeat,linear-gradient(var(--kc),var(--kc)) 0 0/1px 12px no-repeat,
  linear-gradient(var(--kc),var(--kc)) 100% 0/12px 1px no-repeat,linear-gradient(var(--kc),var(--kc)) 100% 0/1px 12px no-repeat,
  linear-gradient(var(--kc),var(--kc)) 0 100%/12px 1px no-repeat,linear-gradient(var(--kc),var(--kc)) 0 100%/1px 12px no-repeat,
  linear-gradient(var(--kc),var(--kc)) 100% 100%/12px 1px no-repeat,linear-gradient(var(--kc),var(--kc)) 100% 100%/1px 12px no-repeat,var(--yuzey)}
.sol,.sag{top:calc(var(--ust) + var(--g));bottom:var(--alt);overflow:auto;overscroll-behavior:contain}
.sol{left:var(--g);width:calc(var(--sol) - 2*var(--g))}
.sag{right:var(--g);width:calc(var(--sag) - 2*var(--g))}
.blok{padding:11px 12px}
.blok+.blok{border-top:1px solid var(--cizgi)}
.blok-bas{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;min-height:20px}
.sol,.sag,.alt{counter-reset:bl}
.bas{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--metin)}
.bas::before{counter-increment:bl;content:counter(bl,decimal-leading-zero) " / ";color:var(--sonuk);font-weight:400}
:lang(zh) .bas{letter-spacing:.08em}
.say{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ikincil);padding:1px 5px;border-radius:var(--r2);background:var(--yuzey2);border:1px solid var(--cizgi);white-space:nowrap}
.bag-dugme{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ikincil);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--cizgi2)}
.bag-dugme:hover{color:var(--metin)}

/* Durum kutucukları: filtre + sayı + oran */
.durumlar{border:1px solid var(--cizgi)}
.dk{width:100%;display:grid;grid-template-columns:8px 4px minmax(0,1fr) 46px 20px;gap:8px;align-items:center;height:28px;padding:0 8px;border:0;background:transparent;cursor:pointer;text-align:left}
.dk+.dk{border-top:1px solid var(--cizgi)}
.dk::before{content:"";width:8px;height:8px;box-sizing:border-box;border:1px solid currentColor}
.dk[aria-pressed="true"]::before{background:linear-gradient(currentColor,currentColor) center/4px 4px no-repeat}
.dk .ad{font-size:11.5px;color:var(--ikincil);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk[aria-pressed="true"] .ad{color:var(--metin)}
.dk i{height:2px;background:var(--cizgi);display:block}
.dk i span{display:block;height:100%;background:currentColor;opacity:.65}
.dk b{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--metin);text-align:right;font-variant-numeric:tabular-nums}
.dk[aria-pressed="false"] b{color:var(--sonuk)}
.dk:hover{background:var(--yuzey2)}
.ciplar{display:flex;flex-wrap:wrap;gap:4px}
.cip{height:24px;padding:0 7px;border:1px solid var(--cizgi);border-radius:var(--r2);background:transparent;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ikincil);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s,border-color .15s}
.cip .m{font-size:10px;color:var(--sonuk)}
.cip:hover{border-color:var(--cizgi2)}
.cip[aria-pressed="true"]{color:var(--metin);background:var(--yuzey2);border-color:var(--cizgi2)}
.nokta{width:5px;height:5px;border-radius:0;background:currentColor;flex:none;transform:rotate(45deg)}

/* Varlık listesi */
.liste{list-style:none;margin:0 -4px}
.oge{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border-radius:0;cursor:pointer;position:relative;transition:background .15s}
.oge+.oge{margin-top:1px;border-top:1px solid var(--cizgi)}
.oge:hover{background:var(--yuzey2)}
.oge[aria-selected="true"]{background:var(--yuzey2);box-shadow:inset 0 0 0 1px var(--cizgi2)}
.oge[aria-selected="true"]::before{content:"";position:absolute;left:-5px;top:8px;bottom:8px;width:2px;background:var(--r,var(--metin))}
.oge .ad{display:block;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alt-satir{display:flex;gap:6px;align-items:center;font-size:10.5px;white-space:nowrap;overflow:hidden;margin-top:1px}
.alt-satir .m{font-size:10px;color:var(--sonuk)}
.sag-k{display:grid;justify-items:end;gap:1px}
.sag-k .m{font-size:10px;color:var(--sonuk)}
.iz{display:block}
.mono-k{font-family:var(--mono);font-size:10px;color:var(--sonuk);align-self:start;padding-top:2px;letter-spacing:.04em}
.mono-k.buyuk{width:46px;height:46px;border-radius:var(--r2);font-size:15px}
.liste .bos{padding:12px 8px;color:var(--ikincil);font-size:12px}

/* Küre sahnesi */
#sahne{position:fixed;top:var(--ust);left:var(--sol);right:var(--sag);bottom:var(--alt);z-index:1;overflow:hidden}
#kure{position:absolute;inset:0}
#kure canvas{display:block;cursor:crosshair}
.tarama{position:absolute;left:0;right:0;top:0;height:1px;z-index:2;pointer-events:none;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ikincil) 30%,transparent) 20%,color-mix(in srgb,var(--ikincil) 30%,transparent) 80%,transparent);animation:tarama 9s linear infinite}
@keyframes tarama{from{transform:translateY(0)}to{transform:translateY(calc(100vh - var(--ust) - var(--alt)))}}
.vinyet{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse 58% 55% at 50% 48%,transparent 30%,rgba(2,4,3,.88) 100%)}
body.brifing .vinyet{opacity:1}
.hud{position:absolute;pointer-events:none;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--sonuk);line-height:1.7;z-index:2;transition:opacity .5s}
.hud b{color:var(--ikincil);font-weight:400}
.k-sol-ust{left:14px;top:12px}.k-sag-ust{right:14px;top:12px;text-align:right}.k-sol-alt{left:14px;bottom:30px}.k-sag-alt{right:14px;bottom:30px;text-align:right}
.koor{position:absolute;top:50%;transform:translateY(-50%);z-index:2;pointer-events:none;font-family:var(--mono);font-size:9px;line-height:2;letter-spacing:.08em;color:var(--sonuk);white-space:nowrap;transition:opacity .5s}
.koor-l{left:12px;padding-left:6px;border-left:1px solid var(--cizgi2)}
.koor-r{right:12px;padding-right:6px;border-right:1px solid var(--cizgi2);text-align:right}
body.brifing .koor{opacity:0}
.kose{position:absolute;width:14px;height:14px;border-color:var(--cizgi2);border-style:solid;pointer-events:none;z-index:2;transition:opacity .5s}
.kose.a{left:6px;top:6px;border-width:1px 0 0 1px}.kose.b{right:6px;top:6px;border-width:1px 1px 0 0}.kose.c{left:6px;bottom:6px;border-width:0 0 1px 1px}.kose.d{right:6px;bottom:6px;border-width:0 1px 1px 0}
.olcek{display:flex;align-items:flex-end;gap:6px;justify-content:flex-end}
.olcek i{display:block;width:80px;height:5px;border:1px solid var(--sonuk);border-top:0}
.katmanlar{position:absolute;left:14px;top:52px;z-index:3;padding:3px;border:1px solid var(--cizgi);border-radius:var(--r2);background:color-mix(in srgb,var(--yuzey) 92%,transparent);box-shadow:var(--golge)}
.katmanlar>summary{height:26px;padding:0 9px 0 7px;border-radius:var(--r2);display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ikincil);cursor:pointer;list-style:none;white-space:nowrap}
.katmanlar>summary::-webkit-details-marker{display:none}
.katmanlar>summary:hover,.katmanlar[open]>summary{color:var(--metin);background:var(--yuzey2)}
.katmanlar>summary .m{font-size:10px;color:var(--sonuk)}
#katmanlar{display:grid;gap:2px;padding-top:3px;margin-top:3px;border-top:1px solid var(--cizgi)}
.katman{width:100%;height:26px;padding:0 9px 0 7px;border:0;border-radius:var(--r2);background:transparent;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sonuk);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.katman .m{margin-left:auto;padding-left:12px;font-size:10px;color:var(--sonuk)}
.katman::before{content:"";width:7px;height:7px;border-radius:0;border:1px solid currentColor;flex:none}
.katman:hover{color:var(--metin)}
.katman[aria-pressed="true"]{color:var(--metin)}
.katman[aria-pressed="true"]::before{background:var(--metin);border-color:var(--metin)}
.nisan{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;pointer-events:none;z-index:3;display:none}
.nisan::before,.nisan::after,.nisan i::before,.nisan i::after{content:"";position:absolute;width:9px;height:9px;border-color:var(--metin);border-style:solid}
.nisan::before{left:0;top:0;border-width:1px 0 0 1px}.nisan::after{right:0;top:0;border-width:1px 1px 0 0}
.nisan i::before{left:0;bottom:0;border-width:0 0 1px 1px}.nisan i::after{right:0;bottom:0;border-width:0 1px 1px 0}
.nisan-etiket{position:absolute;left:56px;top:-6px;white-space:nowrap;font-family:var(--mono);font-size:10px;line-height:1.7;color:var(--ikincil);padding:6px 9px;border:1px solid var(--cizgi2);border-left:2px solid var(--metin);background:color-mix(in srgb,var(--zemin) 86%,transparent)}
.nisan-etiket b{color:var(--metin);font-weight:500;font-size:10.5px;letter-spacing:.06em}
.ipucu{position:fixed;z-index:20;pointer-events:none;padding:3px 7px;border:1px solid var(--cizgi2);border-radius:var(--r2);background:var(--yuzey2);font-family:var(--mono);font-size:10px;letter-spacing:.04em;opacity:0;transform:translate(12px,-50%)}
#ag{position:absolute;inset:0;display:none}
#ag svg{width:100%;height:100%}
.ag-dugum{cursor:pointer}
.ag-dugum text{font-family:var(--mono);font-size:11px;fill:var(--ikincil)}

/* Sağ panel: özet ve varlık dosyası */
.sinif{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:8px;padding:4px 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ikincil);background:var(--yuzey2);border-bottom:1px solid var(--cizgi2)}
.sinif b{color:var(--metin);font-weight:500}
.p-bas{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px}
.p-bas.yalin{grid-template-columns:minmax(0,1fr)}
.p-bas h2{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.12em;line-height:1.25;text-transform:uppercase}
.alt-b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--sonuk);margin-top:3px}
.rozet{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border-radius:var(--r2);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--r);background:transparent;border:1px solid color-mix(in srgb,var(--r) 55%,transparent)}
.kapat{width:30px;height:30px;border-radius:var(--r2);border:1px solid var(--cizgi);background:transparent;color:var(--ikincil);cursor:pointer;display:grid;place-items:center;font-family:var(--mono)}
.kapat:hover{background:var(--yuzey2);color:var(--metin)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--cizgi);border-top:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi)}
.kpi>div{background:var(--yuzey);padding:9px 12px 8px;min-width:0}
.kpi .e{display:block}
.kpi b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;line-height:1.2;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:11px;color:var(--sonuk);margin-left:4px;letter-spacing:0;font-weight:400}
.kpi svg{display:block;margin-top:5px;width:100%;height:18px}
.bolum{padding:12px;border-bottom:1px solid var(--cizgi)}
.etki{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;align-items:center}
.etki svg{width:80px;height:80px;display:block}
.etki-c{font-size:12px;line-height:1.5;margin-bottom:8px}
.etki-c b{font-family:var(--mono);font-weight:500}
.oran{width:100%;border-collapse:collapse;font-size:11.5px;color:var(--ikincil)}
.oran td{padding:4px 0;border-top:1px solid var(--cizgi);white-space:nowrap}
.oran .cb{width:40%;padding:0 10px}
.oran i{display:block;height:2px;background:var(--cizgi)}
.oran i span{display:block;height:100%;background:currentColor}
.oran .m{text-align:right;font-family:var(--mono);font-size:10px;color:var(--metin);width:26px;font-variant-numeric:tabular-nums}
.oran .s{color:var(--sonuk);width:38px}
.lejant{display:grid;gap:4px}
.lejant div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:11px;color:var(--ikincil)}
.lejant .m{font-size:10px;color:var(--metin)}
.isi{display:grid;grid-template-columns:20px repeat(11,minmax(0,1fr));gap:2px;align-items:center}
.isi i{height:10px;border-radius:0;background:var(--cizgi)}
.isi span{font-family:var(--mono);font-size:9px;color:var(--sonuk);line-height:1.3}
.isi .yl{text-align:center}
.cubuklar{display:grid;gap:7px}
.cubuk{display:grid;grid-template-columns:80px minmax(0,1fr) 20px;align-items:center;gap:8px;font-size:11.5px;color:var(--ikincil)}
.cubuk .yol{height:4px;border-radius:0;background:var(--cizgi);display:flex;gap:1px;overflow:hidden}
.cubuk .yol span{height:100%}
.cubuk .m{text-align:right;font-size:10px;color:var(--metin);font-variant-numeric:tabular-nums}
.alinti{position:relative;padding:9px 11px;border-radius:var(--r2);background:var(--yuzey2);border:1px solid var(--cizgi)}
.alinti::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:2px;border-radius:0;background:var(--r)}
.neden{font-size:12.5px;line-height:1.55;min-height:3.2em}
.atif{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--sonuk)}
.adimlar{list-style:none}
.adimlar li{display:grid;grid-template-columns:11px minmax(0,1fr);gap:10px;padding-bottom:10px;position:relative}
.adimlar li:last-child{padding-bottom:0}
.adimlar li::before{content:"";position:absolute;left:5px;top:14px;bottom:1px;width:1px;background:var(--cizgi2)}
.adimlar li:last-child::before{display:none}
.adimlar i{width:11px;height:11px;border-radius:0;border:1px solid var(--r);background:var(--yuzey);margin-top:2px;transform:rotate(45deg)}
.adimlar li:last-child i{background:var(--r)}
.adimlar time{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--sonuk)}
.adimlar span{font-size:12px}
.yer{display:flex;justify-content:space-between;gap:12px;font-size:12px}
.yer+.yer{margin-top:5px}
.yer .m{font-size:10px;color:var(--sonuk);margin-left:8px}
.yer>.m{color:var(--metin);margin:0}
.markalar{display:flex;flex-wrap:wrap;gap:4px}
.markalar span{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:var(--r2);border:1px solid var(--cizgi);background:var(--yuzey2);color:var(--ikincil)}
.kaynaklar{list-style:none;display:grid;gap:4px}
.kaynaklar a{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--cizgi);border-radius:var(--r2);color:var(--metin);text-decoration:none;font-size:11.5px;transition:background .15s,border-color .15s}
.kaynaklar a:hover{border-color:var(--cizgi2);background:var(--yuzey2)}
.fav{width:24px;height:24px;border-radius:var(--r2);display:grid;place-items:center;background:var(--yuzey2);border:1px solid var(--cizgi);font-family:var(--mono);font-size:10px;color:var(--ikincil)}
.kaynaklar .m{font-size:10px;color:var(--sonuk)}
.dipnot{padding:12px;font-size:11px;line-height:1.5;color:var(--sonuk)}
.dipnot a{color:var(--ikincil)}
.etiket{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.04em}
.d-bds{color:var(--bds)}.d-baski{color:var(--baski)}.d-halk{color:var(--halk)}.d-sonuc{color:var(--sonuc)}

/* İstihbarat kaydı: tıklanınca açılır */
.istih{list-style:none;display:grid;gap:4px}
.olay>summary{display:grid;grid-template-columns:auto auto minmax(0,1fr) 12px;gap:8px;align-items:center;padding:6px 8px;border-radius:var(--r2);cursor:pointer;list-style:none;color:var(--ikincil);transition:background .15s}
.olay>summary::-webkit-details-marker{display:none}
.olay>summary:hover,.olay[open]>summary{background:var(--yuzey2);color:var(--metin)}
.istih .olay{border:1px solid var(--cizgi);border-radius:var(--r2)}
.istih .olay[open]{border-color:var(--cizgi2)}
.olay time{font-family:var(--mono);font-size:10px;color:var(--sonuk);letter-spacing:.02em}
.olay .tur{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:1px 5px;border-radius:var(--r2);color:var(--r);border:1px solid color-mix(in srgb,var(--r) 45%,transparent)}
.metin-s{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok-a{color:var(--sonuk);transition:transform .2s}
.olay[open] .ok-a{transform:rotate(90deg)}
.ac{display:grid;gap:8px;margin:2px 8px 8px;padding:8px 0 2px 10px;border-left:2px solid var(--r)}
.ac p{font-size:12px;line-height:1.5;color:var(--metin)}
.ac dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:11.5px}
.ac dt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--sonuk);text-transform:uppercase}
.ac dd{color:var(--ikincil)}
.eylem{display:flex;gap:4px;flex-wrap:wrap}
.dugme{height:28px;padding:0 10px;border:1px solid var(--cizgi2);border-radius:var(--r2);background:var(--yuzey2);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--metin);display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.dugme:hover{border-color:var(--ikincil)}
.dugme.birincil{background:var(--metin);color:var(--zemin);border-color:var(--metin)}
.dugme.birincil:hover{opacity:.9}

/* Alt şerit: zaman çizelgesi ve olay günlüğü */
.alt{left:var(--g);right:var(--g);bottom:var(--g);height:calc(var(--alt) - 2*var(--g));z-index:6;display:grid;grid-template-columns:minmax(0,1fr) 520px;overflow:hidden}
.zc{border-right:1px solid var(--cizgi);display:flex;flex-direction:column;min-width:0;padding:10px 12px 4px}
.zc .blok-bas{margin-bottom:4px}
.zc svg{flex:1;width:100%;display:block}
.zc .tik{cursor:pointer}
.pencere{display:flex;border:1px solid var(--cizgi)}
.pencere button{height:20px;padding:0 7px;border:0;background:transparent;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--sonuk);cursor:pointer}
.pencere button+button{border-left:1px solid var(--cizgi)}
.pencere button:hover{color:var(--metin)}
.pencere button[aria-pressed="true"]{color:var(--zemin);background:var(--metin)}
.zc .eksen text{font-family:var(--mono);font-size:9.5px;fill:var(--sonuk)}
.gunluk{display:flex;flex-direction:column;min-height:0;padding:10px 6px 0}
.gunluk .blok-bas{padding:0 6px;margin-bottom:4px}
.gunluk ol{list-style:none;overflow:auto;flex:1;padding-bottom:8px}
.gunluk .olay>summary{grid-template-columns:70px 48px minmax(0,1fr) 12px;padding:5px 7px}
.yeni>summary{animation:yeni 1.6s}
@keyframes yeni{from{background:color-mix(in srgb,var(--metin) 7%,transparent)}}
.dip{position:fixed;left:var(--sol);right:var(--sag);bottom:var(--alt);height:24px;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--sonuk)}
.dip-sol{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dip a{color:var(--ikincil);margin-left:6px}
.kunye{flex:none;letter-spacing:.12em;color:var(--ikincil);white-space:nowrap}
.kunye::before{content:"◆";margin-right:6px;color:var(--sonuk)}

.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(2,3,2,.7);padding:16px}
.modal.acik{display:flex}
.modal-ic{width:min(480px,100%);background:var(--yuzey);border:1px solid var(--cizgi2);border-radius:var(--r);overflow:hidden;box-shadow:var(--golge)}
.modal-ic .blok-bas{background:var(--yuzey2);padding:9px 12px 9px 14px;margin:0;border-bottom:1px solid var(--cizgi2)}
.modal-ic .ic{padding:14px}
.modal p{color:var(--ikincil);font-size:12px;line-height:1.55;margin-bottom:10px}
.barkod-satir{display:flex;gap:6px}
.barkod-satir .dugme{height:34px}
.barkod-satir input{flex:1;height:34px;border-radius:var(--r2);padding:0 10px;border:1px solid var(--cizgi2);background:var(--zemin);font-family:var(--mono);letter-spacing:.1em;outline:none}
.dugme{height:34px;padding:0 12px;border:1px solid var(--cizgi2);background:transparent;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.1em}
.dugme:hover{border-color:var(--ikincil)}
.sonuc{margin-top:10px;padding:9px 11px;border:1px solid var(--cizgi2);font-size:12px;display:none}
.sonuc.goster{display:block}.sonuc.uyari{border-color:var(--bds);background:var(--bds-zemin)}
.kunye-satir{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--sonuk);border-top:1px solid var(--cizgi);padding-top:10px;margin:0}

/* Brifing modu */
.serit{position:fixed;left:0;right:0;height:0;background:#000;z-index:40;transition:height .7s cubic-bezier(.7,0,.2,1)}
.serit.u{top:0}.serit.a{bottom:0}
body.brifing .serit{height:9vh}
.sol,.alt,.ust,.dip,.sag{transition:opacity .6s}
body.brifing .sol,body.brifing .alt,body.brifing .ust,body.brifing .dip{opacity:.15;pointer-events:none}
body.brifing .hud,body.brifing .kose{opacity:0}
.br-ust{position:fixed;top:calc(9vh + 14px);left:calc(var(--sol) + 16px);z-index:41;font-family:var(--mono);font-size:10px;color:var(--ikincil);display:none;line-height:1.8;letter-spacing:.04em;background:color-mix(in srgb,var(--zemin) 88%,transparent);padding:0 12px 9px;border:1px solid var(--cizgi2);border-top:2px solid var(--metin);min-width:270px}
.br-kafa{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -12px 7px;padding:3px 12px;border-bottom:1px solid var(--cizgi);font-size:9px;letter-spacing:.16em;color:var(--sonuk)}
.br-ust b{color:var(--metin);font-weight:500;letter-spacing:.14em;font-size:10px}
.br-ilerleme{display:flex;gap:3px;margin-top:7px}
.br-ilerleme span{width:20px;height:2px;background:var(--cizgi2)}
.br-ilerleme span.tamam{background:var(--ikincil)}
.br-ilerleme span.simdi{background:var(--metin)}
.altyazi{position:fixed;left:calc(var(--sol) + (100vw - var(--sol) - var(--sag))/2);bottom:calc(9vh + 18px);transform:translateX(-50%);z-index:41;width:min(640px,calc(100vw - var(--sol) - var(--sag) - 40px));display:none;text-align:center}
.altyazi .kim{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--ikincil);margin-bottom:6px}
.altyazi p{font-family:var(--mono);font-size:13.5px;line-height:1.7;color:var(--metin);min-height:4.7em;background:color-mix(in srgb,var(--zemin) 82%,transparent);padding:8px 12px;border:1px solid var(--cizgi);text-align:left}
.br-kontrol{position:fixed;left:calc(var(--sol) + 16px);bottom:calc(9vh + 18px);z-index:42;display:none;gap:4px}
.br-kontrol button{height:32px;min-width:32px;display:grid;place-items:center;padding:0 9px;border:1px solid var(--cizgi2);background:var(--zemin);color:var(--ikincil);font-family:var(--mono);font-size:10px;cursor:pointer}
.br-kontrol button:hover{color:var(--metin);border-color:var(--ikincil)}
body.brifing .br-ust,body.brifing .altyazi{display:block}
body.brifing .br-kontrol{display:flex}

/* Giriş perdesi ve görev dosyası kapağı (brifing + açılış) */
.giris{position:fixed;inset:0;z-index:50;background:var(--zemin);display:none;flex-direction:column;font-family:var(--mono);transition:opacity .45s;padding:0;overflow:auto}
.giris.acik{display:flex}
.giris::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
.giris::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 62% 58% at 50% 50%,transparent 34%,rgba(2,4,3,.9) 100%)}
.acilis{z-index:70}
.g-serit{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;padding:8px 14px;border-bottom:1px solid var(--cizgi2);font-size:9.5px;letter-spacing:.18em;color:var(--ikincil);background:var(--yuzey2);text-transform:uppercase}
.g-govde{position:relative;z-index:1;margin:auto;width:min(780px,100%);padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.g-ust{font-size:10px;letter-spacing:.3em;color:var(--sonuk)}
.g-etiket{font-size:10px;letter-spacing:.24em;color:var(--ikincil);border:1px solid var(--cizgi2);padding:3px 12px;text-transform:uppercase}
.g-baslik{font-family:var(--mono);font-weight:600;font-size:clamp(20px,4vw,40px);letter-spacing:.14em;color:var(--metin);line-height:1.18;text-transform:uppercase;max-width:100%;overflow-wrap:anywhere}
.g-meta{display:flex;gap:20px;font-size:9.5px;letter-spacing:.14em;color:var(--sonuk);flex-wrap:wrap;justify-content:center;text-transform:uppercase}
.g-redaksiyon{display:flex;gap:4px;width:min(340px,80%);justify-content:center;margin-top:2px}
.g-redaksiyon span{height:5px;background:color-mix(in srgb,var(--metin) 22%,transparent)}
.g-dugme{margin-top:14px;height:40px;padding:0 24px;border:1px solid var(--metin);background:transparent;color:var(--metin);font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;cursor:pointer;text-transform:uppercase}
.g-dugme:hover{background:var(--metin);color:var(--zemin)}
.g-atla{margin-top:0;padding:8px 10px;background:none;border:0;color:var(--sonuk);font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-transform:uppercase}
.g-atla:hover{color:var(--metin)}
.g-satirlar{width:100%;margin-top:10px;display:none;gap:5px;text-align:left}
.giris.akis .g-satirlar,.giris.final .g-satirlar,.acilis .g-satirlar{display:grid}
#giris:not(.akis):not(.final) .g-satirlar{display:none}
.giris.akis .g-dugme,.giris.akis .g-atla,.giris.akis .g-etiket,.giris.final .g-dugme,.giris.final .g-atla,.giris.final .g-etiket{display:none}
.giris.akis .g-baslik{font-size:14px;letter-spacing:.24em;color:var(--ikincil)}
.giris .satir{min-height:1.6em;color:var(--ikincil);font-size:11.5px;letter-spacing:.08em;border-left:1px solid var(--cizgi2);padding-left:10px}
.giris .satir.k{color:var(--metin)}
.giris.final .g-baslik{color:var(--metin)}
.acilis .g-etiket{order:-1}
.acilis .g-ust{font-family:var(--mono);font-weight:600;font-size:clamp(20px,4vw,40px);letter-spacing:.14em;color:var(--metin);line-height:1.18;text-transform:uppercase}
.acilis .g-satirlar{margin-top:14px}
.imlec::after{content:"▍";animation:nabiz 1s steps(1) infinite;margin-left:2px;color:var(--metin)}
.sansur{position:relative;display:inline-block}
.sansur::after{content:"";position:absolute;inset:-1px -2px;background:var(--ikincil);transform-origin:right;animation:sansur .7s cubic-bezier(.7,0,.2,1) forwards;animation-delay:var(--g,0s)}
@keyframes sansur{to{transform:scaleX(0)}}


/* ---- Tam ekran küre + üstünde yarı saydam katmanlar ---- */
#sahne{top:var(--ust);left:0;right:0;bottom:0}
.sol,.sag,.alt{background-color:color-mix(in srgb,var(--yuzey) 88%,transparent)}
.sol,.sag{z-index:6}
.sag{transition:opacity .35s,transform .35s}
body.secim .sag{opacity:0;transform:translateX(16px);pointer-events:none}
.kose{display:none}
.koor{font-size:10px}
.koor-l{left:calc(var(--sol) + 12px)}
.koor-r{right:calc(var(--sag) + 12px);transition:opacity .5s,right .35s}
body.secim .koor-r{right:24px}
.k-sol-ust{left:calc(var(--sol) + 14px)}
.k-sag-ust{right:calc(var(--sag) + 14px);transition:right .35s}
body.secim .k-sag-ust{right:24px}
.k-sol-alt{left:calc(var(--sol) + 14px);bottom:calc(var(--alt) + 34px)}
.k-sag-alt{right:calc(var(--sag) + 14px);bottom:calc(var(--alt) + 34px)}
body.secim .k-sag-alt,body.secim .k-sol-alt{display:none}
/* Dil geçişi: metin katmanı söner, yeni dilde geri gelir */
body.dil-gecis .ust,body.dil-gecis .sol,body.dil-gecis .sag,body.dil-gecis .alt,body.dil-gecis .dip,body.dil-gecis #intel,body.dil-gecis .katmanlar,body.dil-gecis .altyazi,body.dil-gecis .br-ust,body.dil-gecis .koor,body.dil-gecis .hud,body.dil-gecis .nisan-etiket{opacity:0;transition:opacity .12s linear!important}
body.dil-gel .ust,body.dil-gel .sol,body.dil-gel .sag,body.dil-gel .alt,body.dil-gel .dip,body.dil-gel #intel,body.dil-gel .katmanlar,body.dil-gel .altyazi,body.dil-gel .br-ust,body.dil-gel .koor,body.dil-gel .hud,body.dil-gel .nisan-etiket{opacity:1;transition:opacity .16s linear!important}
body.dil-gel.secim .sag{opacity:0}
.katmanlar{left:calc(var(--sol) + 14px)}
.dip{left:var(--sol);right:var(--sag);bottom:var(--alt)}
#onder{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}

/* ---- İstihbarat pencereleri ---- */
#intel{position:fixed;top:var(--ust);left:0;right:0;bottom:0;z-index:5;pointer-events:none}
.iw{position:absolute;pointer-events:auto;display:flex;flex-direction:column}
.iw.a{left:calc(var(--sol) + 24px);top:82px;width:400px;max-height:calc(100% - var(--alt) - 118px)}
.iw.b{right:24px;bottom:calc(var(--alt) + 40px);width:356px;max-height:calc(100% - var(--alt) - 160px)}
.iw-sinif{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;padding:3px 7px;border:1px solid var(--cizgi2);background:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--metin) 4%,transparent) 6px 7px),color-mix(in srgb,var(--zemin) 88%,transparent);font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ikincil);text-transform:uppercase;white-space:nowrap;flex:none;overflow:hidden}
.iw-sinif span:nth-child(2){color:var(--sonuk)}
.plaka-s{display:flex;align-items:stretch;gap:8px;margin-bottom:6px;flex:none;min-width:0}
.plaka-s .nis{color:var(--metin);flex:none;align-self:center}
.plaka{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0;max-width:100%;background:color-mix(in srgb,var(--zemin) 92%,transparent);border:1px solid var(--cizgi2);padding:5px 10px 7px}
.plaka::before{content:"";position:absolute;inset:-2px;pointer-events:none;background:
  linear-gradient(var(--metin),var(--metin)) left top/9px 1px no-repeat,linear-gradient(var(--metin),var(--metin)) left top/1px 9px no-repeat,
  linear-gradient(var(--metin),var(--metin)) right top/9px 1px no-repeat,linear-gradient(var(--metin),var(--metin)) right top/1px 9px no-repeat,
  linear-gradient(var(--metin),var(--metin)) left bottom/9px 1px no-repeat,linear-gradient(var(--metin),var(--metin)) left bottom/1px 9px no-repeat,
  linear-gradient(var(--metin),var(--metin)) right bottom/9px 1px no-repeat,linear-gradient(var(--metin),var(--metin)) right bottom/1px 9px no-repeat}
.plaka-kod{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--sonuk);line-height:1}
.plaka-ad{margin:0;font-family:var(--mono);font-weight:600;font-size:17px;letter-spacing:.1em;line-height:1.15;color:var(--metin);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iw.b .plaka-ad{font-size:14px;letter-spacing:.08em}
.plaka-serit{display:block;height:2px;background:var(--r,var(--ikincil));margin-top:1px}
.plaka-s .kapat{margin-left:auto;align-self:center;background:color-mix(in srgb,var(--zemin) 88%,transparent)}
.iw-c{border:1px solid color-mix(in srgb,var(--ikincil) 34%,transparent);border-top:1px solid var(--cizgi2);padding:6px;background:color-mix(in srgb,var(--zemin) 90%,transparent);min-height:0;display:flex;flex-direction:column}
.iw-ust{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:6px;flex:none}
.etk{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:1px 5px;color:var(--metin);border:1px solid var(--cizgi2);text-transform:uppercase}
.etk.durum{display:inline-flex;align-items:center;gap:5px;border-color:color-mix(in srgb,currentColor 60%,transparent);color:var(--r);background:transparent}
.etk.durum .nokta{width:4px;height:4px}
.kod{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--sonuk);margin-left:auto}
.iw-g{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--cizgi2);border:1px solid var(--cizgi2);overflow:auto;min-height:0}
.hucre{background:color-mix(in srgb,var(--zemin) 96%,transparent);padding:8px 9px;min-width:0;position:relative}
.hucre.gen{grid-column:1/-1}
.hb{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sonuk);margin-bottom:6px}
.hb span{letter-spacing:.04em;text-transform:none}
.veri{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11px}
.veri dt{color:var(--ikincil)}
.veri dd{font-family:var(--mono);color:var(--metin);text-align:right;font-variant-numeric:tabular-nums}
.buyuk{display:block;font-family:var(--mono);font-size:22px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.buyuk small,.orta+.kod{font-size:10px;color:var(--sonuk);margin-left:4px;font-weight:400}
.orta{display:block;font-family:var(--mono);font-size:13px;font-weight:500;margin-bottom:2px}
.orta+.kod{margin-left:0}
.iw-alt{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--sonuk);flex:none;text-transform:uppercase}
.iw-alt a{color:var(--ikincil)}
.iw .adimlar span{font-size:11.5px}

const menzil=new THREE.Group(); menzil.visible=false; dunya.add(menzil);
function menzilTemizle(){ menzil.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); }); menzil.clear(); }
function menzilCiz(s){
  menzilTemizle();

  menzil.position.copy(konum); menzil.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),konum.clone().normalize());
  const anaMat=new THREE.LineBasicMaterial({color:css('--metin'),transparent:true,opacity:.5});
  const inceMat=new THREE.LineBasicMaterial({color:css('--metin'),transparent:true,opacity:.26});
  [.055,.105,.155].forEach((r,i)=>{ const p=[]; for(let a=0;a<=96;a++){ const t=a/96*Math.PI*2; p.push(new THREE.Vector3(Math.cos(t)*r,Math.sin(t)*r,0)); }
    menzil.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),i===2?anaMat:inceMat)); });
  for(let i=0;i<24;i++){ const a=i/24*Math.PI*2,uzun=i%6===0?.024:.012;
    const p=[new THREE.Vector3(Math.cos(a)*.166,Math.sin(a)*.166,0),new THREE.Vector3(Math.cos(a)*(.166+uzun),Math.sin(a)*(.166+uzun),0)];
    menzil.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),anaMat)); }
  menzil.visible=true;
}
function menzilGizle(){ menzil.visible=false; menzilTemizle(); }

let karaMat,sinirMat,haritaHata=false;
async function haritaKur(){
  const [kara,ulkeler,tj]=await Promise.all([
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(r=>r.json()),
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>r.json()),
    import('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm')]);
  const W=2048,H=1024,tv=document.createElement('canvas'); tv.width=W; tv.height=H;
  const c=tv.getContext('2d',{willReadFrequently:true}); c.fillStyle='#fff';
  for(const ft of tj.feature(kara,kara.objects.land).features){ const polis=ft.geometry.type==='Polygon'?[ft.geometry.coordinates]:ft.geometry.coordinates;
    for(const poli of polis){ c.beginPath(); for(const h of poli){ h.forEach(([x,y],i)=>{ const px=(x+180)/360*W,py=(90-y)/180*H; i?c.lineTo(px,py):c.moveTo(px,py); }); c.closePath(); } c.fill('evenodd'); } }
  const veri=c.getImageData(0,0,W,H).data,N=64000,poz=[],altin=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<N;i++){ const y=1-(i/(N-1))*2,lat=Math.asin(y)*180/Math.PI,lng=((i*altin)%(2*Math.PI))*180/Math.PI-180;
    const px=Math.floor((lng+180)/360*W)%W,py=Math.min(H-1,Math.floor((90-lat)/180*H));
    if(veri[(py*W+px)*4]>128){ const v=v3(lat,lng,R*1.002); poz.push(v.x,v.y,v.z); } }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(poz,3));
  karaMat=new THREE.PointsMaterial({color:css('--kara'),size:.0065,transparent:true,opacity:.78}); K.kara.add(new THREE.Points(g,karaMat));
  sinirMat=new THREE.LineBasicMaterial({color:css('--sinir'),transparent:true,opacity:.3});
  for(const hat of tj.mesh(ulkeler,ulkeler.objects.countries).coordinates){ K.sinir.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(hat.map(([x,y])=>v3(y,x,R*1.003))),sinirMat)); }
}
$('#hudSol').textContent=t('haritaYuk'); haritaKur().then(()=>{ $('#hudSol').textContent=t('yardim'); }).catch(()=>{ haritaHata=true; $('#hudSol').textContent=t('haritaHata'); });

  const bas=new THREE.Mesh(new THREE.OctahedronGeometry(.011),new THREE.MeshBasicMaterial({color:renk})); bas.position.y=boy; g.add(bas);
  const ayak=new THREE.Mesh(new THREE.RingGeometry(.006,.009,4),new THREE.MeshBasicMaterial({color:renk,side:THREE.DoubleSide})); ayak.rotation.x=-Math.PI/2; ayak.rotation.z=Math.PI/4; ayak.position.y=.001; g.add(ayak);
  const halka=new THREE.Mesh(new THREE.RingGeometry(.013,.0155,48),new THREE.MeshBasicMaterial({color:renk,transparent:true,side:THREE.DoubleSide,depthWrite:false})); halka.rotation.x=-Math.PI/2; halka.position.y=.002; g.add(halka);
  const vur=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({visible:false})); vur.position.y=boy*.6; vur.userData.s=s; g.add(vur);

const yaylar=[];
for(const s of SIRKETLER) for(const b of s.bag){
  const a=v3(s.lat,s.lng,R),bv=v3(b.lat,b.lng,R),aci=a.angleTo(bv),orta=a.clone().add(bv).normalize().multiplyScalar(R+.08+aci*.32);
  const egri=new THREE.QuadraticBezierCurve3(a,orta,bv);
  const cizgi=new THREE.Line(new THREE.BufferGeometry().setFromPoints(egri.getPoints(100)),new THREE.LineDashedMaterial({color:durumRengi(s),transparent:true,opacity:.22,dashSize:.012,gapSize:.008}));
  cizgi.computeLineDistances(); K.yay.add(cizgi);

let ucus=null,beklet=null;

  isin.setFromCamera(fare,kamera); const h=K.merkez.visible?isin.intersectObjects(tiklanabilir)[0]:null; ustunde=h&&h.object.parent.visible?h.object.userData.s:null;

function boyutla(){ const w=kap.clientWidth,h=kap.clientHeight; if(!w||!h)return; ciz.setSize(w,h); kamera.aspect=w/h;
  const yarim=Math.tan(Math.asin(R/MESAFE)),oran=Math.min(.8,.8*w/h);
  kamera.fov=2*Math.atan(yarim/oran)*180/Math.PI; kamera.updateProjectionMatrix(); if(Math.abs(gorKay)>.3) kamera.setViewOffset(w,h,gorKay,0,w,h); agCiz(); zcCiz(); }

const nisan=$('#nisan'),nisanEt=$('#nisanEtiket'),kEl=$('#koordinat'),koorLEl=$('#koorL'),koorREl=$('#koorR'),gv=new THREE.Vector3(),dv=new THREE.Vector3();
function hudGuncelle(){
  gv.copy(kamera.position).normalize(); const Y=t('yonler');
  const lat=Math.asin(gv.y)*180/Math.PI; let lng=Math.atan2(gv.z,-gv.x)*180/Math.PI-180; lng=((lng+540)%360)-180;
  const d=kamera.position.length(),gor=Math.round(2*(d-R)*Math.tan(kamera.fov*Math.PI/360)*6371);
  kEl.innerHTML=`<b>${t('merkez')}</b> ${lat>=0?Y[0]:Y[1]} ${Math.abs(lat).toFixed(4)}° · ${lng>=0?Y[2]:Y[3]} ${Math.abs(lng).toFixed(4)}°<br>${t('irtifa')} ${sayiTR(Math.round((d-R)*6371))} km · ${t('gorus')} ${sayiTR(gor)} km`;
  $('#olcekYazi').textContent=sayiTR(Math.round(gor*80/kap.clientWidth/100)*100||100)+' km';
  const yar=Math.acos(Math.min(1,R/d))*180/Math.PI,adim=Math.max(5,Math.round(yar/3/5)*5),buk=v=>((v+180)%360+360)%360-180;
  const nk=v=>`${v>=0?Y[0]:Y[1]} ${String(Math.abs(Math.round(v))).padStart(2,'0')}°`,ek=v=>`${v>=0?Y[2]:Y[3]} ${String(Math.abs(Math.round(v))).padStart(3,'0')}°`;
  const kl=[2,1,0,-1,-2].map(k=>nk(Math.max(-90,Math.min(90,lat+adim*k/2)))).join('<br>');
  const kr=[2,1,0,-1,-2].map(k=>ek(buk(lng+adim*k/2))).join('<br>');
  if(koorLEl.innerHTML!==kl) koorLEl.innerHTML=kl;
  if(koorREl.innerHTML!==kr) koorREl.innerHTML=kr;
  if(secili&&K.merkez.visible){ const m=isaretler.find(x=>x.s.id===secili.id);
    m.bas.getWorldPosition(dv); const arka=dv.clone().normalize().dot(kamera.position.clone().normalize())<.15;
    dv.project(kamera); nisan.style.display=arka?'none':'block'; nisan.style.left=(dv.x+1)/2*kap.clientWidth+'px'; nisan.style.top=(1-dv.y)/2*kap.clientHeight+'px';
  } else nisan.style.display='none';
}
let gorKay=0;
function gorKayHedef(){ if(!secili||innerWidth<1024)return 0; const W=kap.clientWidth,sol=parseFloat(css('--sol'))||290; return -((sol+24+400)+(W-24-350)-W)/2; }
function dongu(z){
  if(ucus){ const k=Math.min(1,(z-ucus.t0)/ucus.sure),e=kolay(k),l=THREE.MathUtils.lerp(ucus.bas.length(),ucus.hedef.length(),e);
    kamera.position.copy(ucus.bas).normalize().lerp(ucus.hedef.clone().normalize(),e).normalize().multiplyScalar(l); if(k>=1)ucus=null; }
  kontrol.update();
  { const h=gorKayHedef(); if(Math.abs(h-gorKay)>.3){ gorKay+=(h-gorKay)*(azHareket?1:.07); const w=kap.clientWidth,hh=kap.clientHeight; if(Math.abs(gorKay)>.3) kamera.setViewOffset(w,hh,gorKay,0,w,hh); else kamera.clearViewOffset(); } }
  taramaGrp.rotation.y=azHareket?.7:z/1000*.42;
  for(const m of isaretler){ const p=azHareket?.5:((z/1000*.55+m.faz)%1),sk=1+p*3; m.halka.scale.set(sk,sk,sk); m.halka.material.opacity=(1-p)*.7;
    m.bas.rotation.y=z/900; m.bas.scale.setScalar(secili?.id===m.s.id?1.6:1); }
  for(const y of yaylar){ const ak=secili?.id===y.s.id;
    y.cizgi.material.opacity=ak?.95:(secili?.08:.22); y.cizgi.material.dashSize=ak?1:.012;
    if(ak){ const k=Math.min(1,(z-y.t0)/900); y.cizgi.geometry.setDrawRange(0,Math.floor(kolay(k)*101)); y.isik.visible=k>=1; if(k>=1) y.isik.position.copy(y.egri.getPoint(((z-y.t0)/1700)%1)); y.uc.material.opacity=1; }
    else { y.cizgi.geometry.setDrawRange(0,101); y.isik.visible=false; y.uc.material.opacity=secili?.15:.5; } }
  hudGuncelle(); onderCiz(); ciz.render(sahne,kamera); requestAnimationFrame(dongu);
}

function cizgiSvg(d,r='var(--ikincil)'){ const W=140,H=22,mx=Math.max(...d,1),st=W/(d.length-1),p=d.map((v,i)=>`${(i*st).toFixed(1)},${(H-2-(v/mx)*(H-5)).toFixed(1)}`);

function halkaSvg(){ const R=40,C=2*Math.PI*R,top=SIRKETLER.length,sn=SIRKETLER.filter(s=>s.durum==='sonuc').length; let off=0;
  const parca=Object.keys(DURUM).map(k=>{ const n=SIRKETLER.filter(s=>s.durum===k).length,u=n/top*C; const p=n?`<circle cx="48" cy="48" r="${R}" fill="none" stroke="var(${DURUM[k][1]})" stroke-width="8" stroke-dasharray="${Math.max(0,u-2.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 48 48)"/>`:''; off+=u; return p; }).join('');
  return `<svg viewBox="0 0 96 96" role="img" aria-label="${sn}/${top}"><circle cx="48" cy="48" r="${R}" fill="none" stroke="var(--cizgi)" stroke-width="8"/>${parca}<text x="48" y="54" text-anchor="middle" style="font-family:var(--mono);font-size:19px;font-weight:500;fill:var(--metin)">${sn}/${top}</text></svg>`; }

function grafikSvg(s){
  const W=340,H=176,cx=W/2,cy=H/2,dug=[...s.markalar.map(m=>['m',m]),...s.bag.map(b=>['b',L(b.e)]),...s.kaynak.map(k=>['k',alanAdi(k[1])])];
  const p=dug.map((d,i)=>{ const a=-Math.PI/2+i*2*Math.PI/dug.length; return [cx+Math.cos(a)*W*.24,cy+Math.sin(a)*H*.36,d]; });
  const sekil=(x,y,q)=>q==='m'?`<circle cx="${x}" cy="${y}" r="4" fill="var(--yuzey)" stroke="var(--ikincil)" stroke-width="1.5"/>`:q==='b'?`<rect x="${x-4.5}" y="${y-4.5}" width="9" height="9" rx="1.5" transform="rotate(45 ${x} ${y})" fill="var(--yuzey)" stroke="var(--aksan)" stroke-width="1.5"/>`:`<rect x="${x-4}" y="${y-4}" width="8" height="8" rx="2" fill="var(--yuzey)" stroke="var(--sonuk)" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="display:block">
    ${p.map(([x,y,[q]])=>`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${q==='b'?'var(--aksan)':'var(--cizgi2)'}" stroke-opacity="${q==='b'?.6:1}" ${q==='b'?'stroke-dasharray="3 3"':''}/>`).join('')}
    ${p.map(([x,y,[q,a]])=>`${sekil(x,y,q)}<text x="${x+(x<cx-1?-9:9)}" y="${y+4}" text-anchor="${x<cx-1?'end':'start'}" style="font-size:11.5px;fill:var(--ikincil)">${a.length>20?a.slice(0,19)+'…':a}</text>`).join('')}
    <circle cx="${cx}" cy="${cy}" r="14" fill="color-mix(in srgb,${renk(s)} 14%,var(--yuzey))" stroke="${renk(s)}" stroke-width="1.5"/>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" style="font-family:var(--mono);font-size:11px;font-weight:500;fill:var(--metin)">${ikiHarf(s)}</text></svg>
    <div style="display:flex;gap:16px;margin-top:8px" class="e"><span>${t('lMarka')}</span><span style="color:var(--aksan)">${t('lFaaliyet')}</span><span>${t('lKaynak')}</span></div>`;
}

const ondEl=document.getElementById('onder');
function onderCiz(){
  if(!secili||!$('#intel').firstElementChild||innerWidth<1024||!K.merkez.visible){ if(ondEl.firstChild) ondEl.innerHTML=''; return; }
  const kr=kap.getBoundingClientRect(),ileri=kamera.position.clone().normalize();
  const bag=(sec,lat,lng,hedef)=>{ const w=$(sec); if(!w)return ''; const p=v3(lat,lng,R*1.01); if(p.clone().normalize().dot(ileri)<.15) return '';
    p.project(kamera); const px=(p.x+1)/2*kr.width,py=(1-p.y)/2*kr.height,wr=w.getBoundingClientRect(),pr=w.querySelector('.plaka-s').getBoundingClientRect();
    const sag=px>wr.right-kr.left,ax=(sag?wr.right:wr.left)-kr.left,ay=pr.top-kr.top+pr.height/2,ex=ax+(sag?28:-28);
    const k=hedef?`<path d="M${px-14},${py-8}v-6h6M${px+14},${py-8}v-6h-6M${px-14},${py+8}v6h6M${px+14},${py+8}v6h-6" fill="none" stroke="var(--metin)"/>`:'';
    return `<path d="M${ax},${ay}H${ex}L${px},${py}" fill="none" stroke="var(--ikincil)" stroke-opacity=".75" stroke-dasharray="${hedef?'3 3':'none'}"/><circle cx="${px}" cy="${py}" r="2.5" fill="var(--metin)"/>${k}`; };
  ondEl.innerHTML=bag('.iw.a',secili.lat,secili.lng,false)+bag('.iw.b',secili.bag[0].lat,secili.bag[0].lng,true);
}

let gorunum='kure';
function agCiz(){
  if(gorunum!=='ag')return; const el=$('#ag'),W=el.clientWidth,H=el.clientHeight; if(!W)return;
  const l=filtrele(),cx=W/2,cy=H/2,R1=Math.min(W,H)*.17,R2=Math.min(W,H)*.36;
  const kats=KATEGORI.filter(k=>l.some(s=>s.kategori===k)),kp={},sp={};
  kats.forEach((k,i)=>{ const a=-Math.PI/2+i*2*Math.PI/kats.length; kp[k]=[cx+Math.cos(a)*R1,cy+Math.sin(a)*R1]; });
  l.forEach((s,i)=>{ const a=-Math.PI/2+i*2*Math.PI/l.length; sp[s.id]=[cx+Math.cos(a)*R2,cy+Math.sin(a)*R2,a]; });
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img"><circle cx="${cx}" cy="${cy}" r="${R1}" fill="none" stroke="var(--cizgi)" stroke-dasharray="2 4"/><circle cx="${cx}" cy="${cy}" r="${R2}" fill="none" stroke="var(--cizgi)" stroke-dasharray="2 4"/>`;
  for(const s of l){ const [x,y]=sp[s.id],[kx,ky]=kp[s.kategori],ak=secili?.id===s.id;
    svg+=`<path d="M${kx},${ky} Q${cx},${cy} ${x},${y}" fill="none" stroke="${ak?css(DURUM[s.durum][1]):'var(--cizgi2)'}" stroke-width="${ak?1.5:1}" opacity="${secili&&!ak?.4:1}"/>`; }
  for(const k of kats){ const [x,y]=kp[k]; svg+=`<g><rect x="${x-5}" y="${y-5}" width="10" height="10" fill="var(--zemin)" stroke="var(--ikincil)"/><text x="${x}" y="${y-12}" text-anchor="middle" style="font-family:var(--mono);font-size:11px;fill:var(--ikincil);letter-spacing:1px">${B(katAd(k))}</text></g>`; }
  for(const s of l){ const [x,y,a]=sp[s.id],sag=Math.cos(a)>=0,ak=secili?.id===s.id,r=css(DURUM[s.durum][1]);
    svg+=`<g class="ag-dugum" data-id="${s.id}"><circle cx="${x}" cy="${y}" r="${ak?9:6}" fill="var(--zemin)" stroke="${r}" stroke-width="${ak?2:1.2}"/><circle cx="${x}" cy="${y}" r="2.5" fill="${r}"/>
      <text x="${x+(sag?14:-14)}" y="${y-2}" text-anchor="${sag?'start':'end'}" style="font-family:var(--sans);font-size:12.5px;fill:var(--metin)">${s.ad}</text><text x="${x+(sag?14:-14)}" y="${y+12}" text-anchor="${sag?'start':'end'}">${s.kod} · ${s.ulke}</text></g>`; }
  el.innerHTML=svg+'</svg>';
}

let zcY0=2016;
function zcCiz(){
  const el=$('#zc'),W=el.clientWidth,H=el.clientHeight; if(!W||!H)return;
  const l=filtrele(),y0=zcY0,y1=2027,pad=16,sol=52,x=y=>sol+(y-y0)/(y1-y0)*(W-sol-pad);
  const satir=(H-26)/Math.max(1,l.length),simdi=2026+10.4/12;
  let s=`<g class="eksen">`; for(let y=y0;y<y1;y++){ s+=`<line x1="${x(y)}" y1="0" x2="${x(y)}" y2="${H-18}" stroke="var(--cizgi)"/><text x="${x(y)+4}" y="${H-5}">${y}</text>`; } s+='</g>';
  s+=`<line x1="${x(simdi)}" y1="0" x2="${x(simdi)}" y2="${H-18}" stroke="var(--aksan)" stroke-dasharray="2 3"/><text x="${x(simdi)-4}" y="${H-5}" text-anchor="end" style="font-family:var(--mono);font-size:11px;fill:var(--aksan)">${t('simdi')}</text>`;
  let say=0; s+=`<clipPath id="zcKes"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath><g clip-path="url(#zcKes)">`;
  l.forEach((sr,i)=>{ const yy=6+i*satir+satir/2,ak=secili?.id===sr.id,r=css(DURUM[sr.durum][1]),yillar=sr.zaman.map(z=>tarihYil(z[0]));
    if((sr.durum==='sonuc'?Math.max(...yillar):simdi)>=y0) s+=`<line x1="${Math.max(sol-4,x(Math.min(...yillar)))}" y1="${yy}" x2="${sr.durum==='sonuc'?x(Math.max(...yillar)):x(simdi)}" y2="${yy}" stroke="${r}" stroke-opacity="${ak?.9:.3}" stroke-width="${ak?2:1}"/>`;

/* ================= SES MOTORU (Web Audio; dosya yok, her şey üretilir) ================= */
const Ses=(()=>{
  let ctx=null,ana,muzikBus,efektBus,yanki,dronSuz,acik=false,zamanlayici=null,adim=0,sonraki=0,yogun=false,akor=0;
  const ON6=60/92/4;
  const KARANLIK=[[38,41,45,48],[34,38,41,45],[31,34,38,41],[33,37,40,43]];      /* Re min · Si♭ · Sol min · La */
  const KAHRAMAN=[[38,45,50,53],[34,46,50,53],[29,45,48,53],[36,43,48,52]];      /* Re min → Si♭ → Fa → Do */
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function kur(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const sik=ctx.createDynamicsCompressor(); sik.threshold.value=-18; sik.ratio.value=4; sik.connect(ctx.destination);
    ana=ctx.createGain(); ana.gain.value=0; ana.connect(sik);
    muzikBus=ctx.createGain(); muzikBus.gain.value=.32; muzikBus.connect(ana);
    efektBus=ctx.createGain(); efektBus.gain.value=.55; efektBus.connect(ana);
    yanki=ctx.createConvolver(); const uz=ctx.sampleRate*2.8,ir=ctx.createBuffer(2,uz,ctx.sampleRate);
    for(let k=0;k<2;k++){ const d=ir.getChannelData(k); for(let i=0;i<uz;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/uz,3.2); }
    yanki.buffer=ir; const yG=ctx.createGain(); yG.gain.value=.35; yanki.connect(yG); yG.connect(ana);
    dronSuz=ctx.createBiquadFilter(); dronSuz.type='lowpass'; dronSuz.frequency.value=180; dronSuz.Q.value=6;
    const dg=ctx.createGain(); dg.gain.value=.22; dronSuz.connect(dg); dg.connect(muzikBus);
    [[26,-6],[26,7],[33,0]].forEach(([m,d])=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=hz(m); o.detune.value=d; o.connect(dronSuz); o.start(); });
    const lfo=ctx.createOscillator(),lg=ctx.createGain(); lfo.frequency.value=.07; lg.gain.value=90; lfo.connect(lg); lg.connect(dronSuz.frequency); lfo.start();
  }
  const gurultu=sure=>{ const b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*sure),ctx.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; return s; };
  const zarf=(g,z,a,tepe,b)=>{ g.gain.setValueAtTime(0,z); g.gain.linearRampToValueAtTime(tepe,z+a); g.gain.exponentialRampToValueAtTime(.0001,z+a+b); };
  function ped(z,notalar){ const sure=ON6*32,suz=ctx.createBiquadFilter(),g=ctx.createGain(); suz.type='lowpass'; suz.frequency.setValueAtTime(400,z); suz.frequency.linearRampToValueAtTime(1100,z+4); suz.frequency.linearRampToValueAtTime(500,z+sure);
    g.gain.setValueAtTime(0,z); g.gain.linearRampToValueAtTime(.05,z+2.2); g.gain.setValueAtTime(.05,z+sure-1.2); g.gain.linearRampToValueAtTime(0,z+sure);
    suz.connect(g); g.connect(muzikBus); g.connect(yanki);
    notalar.forEach(m=>[-8,8].forEach(d=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=hz(m+12); o.detune.value=d; o.connect(suz); o.start(z); o.stop(z+sure+.1); })); }
  /* Bakır nefesli benzeri ses: testere yığını, süzgeç yavaşça açılır (şişme) */
  function boru(z,notalar,sure,tepe=.07){ const suz=ctx.createBiquadFilter(),g=ctx.createGain(); suz.type='lowpass'; suz.Q.value=2;
    suz.frequency.setValueAtTime(350,z); suz.frequency.linearRampToValueAtTime(1800,z+sure*.45); suz.frequency.linearRampToValueAtTime(700,z+sure);
    g.gain.setValueAtTime(0,z); g.gain.linearRampToValueAtTime(tepe,z+sure*.35); g.gain.linearRampToValueAtTime(tepe*.6,z+sure*.9); g.gain.linearRampToValueAtTime(0,z+sure+.05);
    suz.connect(g); g.connect(muzikBus); g.connect(yanki);
    notalar.forEach((m,i)=>[-6,0,6].forEach(d=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=hz(m+(i?12:0)); o.detune.value=d; o.connect(suz); o.start(z); o.stop(z+sure+.1); })); }
  function bas(z,m,v){ const o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.createBiquadFilter(); o.type='square'; o.frequency.value=hz(m); s.type='lowpass'; s.frequency.setValueAtTime(600,z); s.frequency.exponentialRampToValueAtTime(90,z+.18);
    o.connect(s); s.connect(g); g.connect(muzikBus); zarf(g,z,.004,v,.2); o.start(z); o.stop(z+.25); }
  function tikirti(z,v){ const n=gurultu(.04),s=ctx.createBiquadFilter(),g=ctx.createGain(); s.type='highpass'; s.frequency.value=7000; n.connect(s); s.connect(g); g.connect(muzikBus); zarf(g,z,.001,v,.035); n.start(z); }
  function davul(z,v=.5){ const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.setValueAtTime(110,z); o.frequency.exponentialRampToValueAtTime(38,z+.35); o.connect(g); g.connect(muzikBus); g.connect(yanki); zarf(g,z,.003,v,.45); o.start(z); o.stop(z+.5); }
  function sonar(z){ const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=hz(81); o.connect(g); g.connect(yanki); g.connect(muzikBus); zarf(g,z,.005,.06,1.4); o.start(z); o.stop(z+1.5); }
  function planla(){
    while(sonraki<ctx.currentTime+.12){
      const z=sonraki,olcu=Math.floor(adim/16),ici=adim%16;
      if(!yogun){ if(adim%128===0){ akor=(olcu/8)%KARANLIK.length; ped(z,KARANLIK[akor]); } }
      else {
        const k=KAHRAMAN[Math.floor(olcu/2)%KAHRAMAN.length];
        if(adim%32===0) boru(z,k,ON6*32);
        if(ici%2===0) bas(z,k[0]-12+(ici===6||ici===14?12:0),ici%4===0?.15:.08);
        tikirti(z,ici%4===2?.05:.018);
        if(ici===0||ici===8) davul(z);
        if(olcu%4===3&&ici>=12) davul(z,.22);
      }
      if(ici===0&&olcu%4===3) sonar(z+ON6*8);
      adim++; sonraki+=ON6; }
  }
  const E={
    tik(){ const z=ctx.currentTime,n=gurultu(.012),s=ctx.createBiquadFilter(),g=ctx.createGain(); s.type='bandpass'; s.frequency.value=2600+Math.random()*1800; s.Q.value=3; n.connect(s); s.connect(g); g.connect(efektBus); zarf(g,z,.001,.12,.01); n.start(z); },
    blip(f=1300){ const z=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.setValueAtTime(f,z); o.frequency.exponentialRampToValueAtTime(f*.7,z+.06); o.connect(g); g.connect(efektBus); zarf(g,z,.002,.12,.07); o.start(z); o.stop(z+.1); },
    kilit(){ const z=ctx.currentTime; [[1400,0],[1400,.09],[2100,.18]].forEach(([f,d])=>{ const o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.createBiquadFilter(); o.type='square'; o.frequency.value=f; s.type='lowpass'; s.frequency.value=3000; o.connect(s); s.connect(g); g.connect(efektBus); zarf(g,z+d,.002,.05,.05); o.start(z+d); o.stop(z+d+.08); }); },
    vin(){ const z=ctx.currentTime,n=gurultu(1.4),s=ctx.createBiquadFilter(),g=ctx.createGain(); s.type='bandpass'; s.Q.value=1.4; s.frequency.setValueAtTime(300,z); s.frequency.exponentialRampToValueAtTime(2400,z+.7); s.frequency.exponentialRampToValueAtTime(500,z+1.3);
      n.connect(s); s.connect(g); g.connect(efektBus); g.gain.setValueAtTime(0,z); g.gain.linearRampToValueAtTime(.16,z+.6); g.gain.linearRampToValueAtTime(0,z+1.35); n.start(z); },
    darbe(){ const z=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.setValueAtTime(90,z); o.frequency.exponentialRampToValueAtTime(28,z+1.2); o.connect(g); g.connect(efektBus); g.connect(yanki); zarf(g,z,.005,.9,1.6); o.start(z); o.stop(z+1.8);
      const n=gurultu(.5),s=ctx.createBiquadFilter(),g2=ctx.createGain(); s.type='lowpass'; s.frequency.value=900; n.connect(s); s.connect(g2); g2.connect(yanki); g2.connect(efektBus); zarf(g2,z,.002,.35,.4); n.start(z); },
    ust(){ const z=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=2400; o.connect(g); g.connect(efektBus); zarf(g,z,.001,.025,.02); o.start(z); o.stop(z+.03); },
    /* Zafer vurgusu: Fa majörden Do majöre yükselen bakır + davul gümbürtüsü */
    zafer(){ const z=ctx.currentTime+.05; boru(z,[41,53,57,60],1.1,.11); boru(z+1.0,[36,52,55,60],2.6,.13); [0,.12,.24,.36,.5].forEach((d,i)=>davul(z+.6+d,.18+i*.06)); davul(z+1.0,.7); },
    final(){ const z=ctx.currentTime+.05; boru(z,[34,50,53,58],1.4,.1); boru(z+1.3,[36,52,55,60],1.4,.12); boru(z+2.6,[29,53,57,60],4.5,.15); [0,.1,.2,.3,.4,.5,.6].forEach((d,i)=>davul(z+2.0+d,.15+i*.05)); davul(z+2.6,.8); }
  };
  return {
    get acik(){return acik},
    async ac(tercih){ if(!ctx) kur(); await ctx.resume(); acik=true; ana.gain.cancelScheduledValues(ctx.currentTime); ana.gain.setValueAtTime(ana.gain.value,ctx.currentTime); ana.gain.linearRampToValueAtTime(.9,ctx.currentTime+1.2);
      if(!zamanlayici){ sonraki=ctx.currentTime+.05; zamanlayici=setInterval(planla,25); } sesDugmeCiz(); if(tercih){ try{localStorage.setItem('ses','1')}catch(e){} } },
    kapat(){ acik=false; sesDugmeCiz(); try{localStorage.setItem('ses','0')}catch(e){} if(!ctx)return; ana.gain.cancelScheduledValues(ctx.currentTime); ana.gain.setValueAtTime(ana.gain.value,ctx.currentTime); ana.gain.linearRampToValueAtTime(0,ctx.currentTime+.4);
      setTimeout(()=>{ if(!acik){ clearInterval(zamanlayici); zamanlayici=null; ctx.suspend(); } },500); },
    yogunluk(v){ if(yogun!==v){ yogun=v; adim=Math.ceil(adim/32)*32; } if(ctx) dronSuz.Q.setTargetAtTime(v?10:6,ctx.currentTime,.5); },
    cal(ad,...a){ if(acik&&ctx&&E[ad]) E[ad](...a); }
  };
})();

  $('#brKim').textContent=`${s.kod} · ${B(durumAd(s.durum))}`; $('#brMetin').textContent='';

  await yaz($('#brMetin'),metin,dil==='zh'?60:24,true); if(j!==br.jeton)return;
  /* Boykotun sonuç aldığı yerde zafer anı */
  if(s.durum==='sonuc'){ Ses.cal('zafer'); $('#brKim').innerHTML=`<span style="color:var(--basari)">${s.kod} · ${t('basarili')}</span>`; }
  br.zaman=setTimeout(()=>{ if(!br.dur&&j===br.jeton) brSonraki(); },s.durum==='sonuc'?4600:3400);
}
function brSonraki(){ if(!br.acik)return; if(br.i<SIRKETLER.length-1){ br.i++; brAdim(); } else brifingFinal(); }
function brOnceki(){ if(br.acik&&br.i>0){ br.i--; brAdim(); } }
/* Kapanış: sayılar uydurma değil, veriden hesaplanır */
async function brifingFinal(){
  const j=++br.jeton; clearTimeout(br.zaman); const g=$('#giris'); g.classList.remove('akis'); g.classList.add('acik','final'); g.setAttribute('aria-hidden','false'); g.style.opacity=0; await bekle(30); g.style.opacity=1;
  ['gBaslik','g1','g2','g3'].forEach(x=>$('#'+x).textContent='');
  const sonuc=SIRKETLER.filter(s=>s.durum==='sonuc'); Ses.yogunluk(false); Ses.cal('final');
  await bekle(700); await yaz($('#gBaslik'),t('bitti'),40,true); if(j!==br.jeton)return;
  await yaz($('#g1'),t('f1',{n:SIRKETLER.length,s:sonuc.length}),22,true); if(j!==br.jeton)return;
  if(sonuc.length){ await yaz($('#g2'),t('f2',{l:sonuc.map(s=>B(s.ad)).join(t('ve'))}),22,true); if(j!==br.jeton)return; }
  await yaz($('#g3'),t('f3'),30,true); await bekle(3200); if(j!==br.jeton)return;
  brifingBitir();
}
function brifingBitir(){ if(!br.acik)return; br.acik=false; br.jeton++; clearTimeout(br.zaman); kapakTemizle(); Ses.yogunluk(false); document.body.classList.remove('brifing');
  const g=$('#giris'); g.style.opacity=0; setTimeout(()=>{ if(!br.acik){ g.classList.remove('acik','akis','final'); g.setAttribute('aria-hidden','true'); } },900); $('#brMetin').textContent=''; birak();
  ucus={bas:kamera.position.clone(),hedef:new THREE.Vector3(.9,.75,3.2).setLength(MESAFE),t0:performance.now(),sure:1200}; }
$('#brifingAc').onclick=brifingBaslat; $('#brIleri').onclick=brSonraki; $('#brGeri').onclick=brOnceki; $('#brCik').onclick=brifingBitir;
$('#brDur').onclick=()=>{ br.dur=!br.dur; $('#brDur').innerHTML=br.dur?IK.oyna:IK.dur; $('#brDur').setAttribute('aria-label',t(br.dur?'brOyna':'brDur')); if(!br.dur){ clearTimeout(br.zaman); br.zaman=setTimeout(brSonraki,1200); } };
addEventListener('keydown',e=>{ if(!br.acik||$('#giris').classList.contains('acik'))return; if(e.key==='ArrowRight')brSonraki(); if(e.key==='ArrowLeft')brOnceki(); if(e.key===' '){ e.preventDefault(); $('#brDur').click(); } },true);

/* ================= MODALLAR, BARKOD ================= */
const ac=id=>{ $(id).classList.add('acik'); $(id).querySelector('input,button')?.focus(); };
$('#barkodAc').onclick=()=>ac('#barkodModal'); $('#yontemAc').onclick=()=>ac('#yontemModal'); $('#yasalAc').onclick=e=>{e.preventDefault();ac('#yontemModal')};
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m||e.target.closest('[data-kapat]')) m.classList.remove('acik'); }));
addEventListener('keydown',e=>{ if(e.key==='Escape'){ const m=document.querySelector('.modal.acik'); if(m) m.classList.remove('acik'); else if(br.acik) brifingBitir(); else if(secili) birak(); } });
const ean13=k=>{ if(!/^\d{13}$/.test(k))return false; const top=[...k.slice(0,12)].reduce((a,d,i)=>a+ +d*(i%2?3:1),0); return (10-top%10)%10=== +k[12]; };
function barkodSor(){ const k=$('#barkod').value.replace(/\D/g,''),o=$('#barkodSonuc'); o.className='sonuc goster';
  if(k.length!==13){ o.textContent=t('bk13'); return; }
  if(!ean13(k)){ o.textContent=t('bkHane'); return; }
  if(k.startsWith('729')){ o.classList.add('uyari'); o.innerHTML=t('bk729'); Ses.cal('kilit'); }
  else o.innerHTML=t('bkTemiz',{p:`<span class="m">${k.slice(0,3)}</span>`}); }
$('#barkodSor').onclick=barkodSor; $('#barkod').addEventListener('keydown',e=>{ if(e.key==='Enter') barkodSor(); });

/* ================= DİL UYGULA ================= */
function dilUygula(){
  kok.lang=dil==='zh'?'zh-CN':dil;
  document.title='Boykot · '+t('altBaslik');
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('[data-t-placeholder]').forEach(el=>el.placeholder=t(el.dataset.tPlaceholder));
  document.querySelectorAll('[data-t-aria-label]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.tAriaLabel)));
  document.querySelectorAll('[data-t-title]').forEach(el=>el.title=t(el.dataset.tTitle));
  document.querySelectorAll('.dil').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dil===dil));
  if(haritaHata) $('#hudSol').textContent=t('haritaHata');
  katmanCiz(); ciplerCiz(); gorunumAdCiz(); sesDugmeCiz(); tabloCiz(); gunlukCiz();
  if(secili){ dosyaCiz(secili,false); nisanCiz(secili); } else genelCiz();
  if(br.acik&&!$('#giris').classList.contains('acik')){ brUstCiz(); const s=SIRKETLER[br.i]; $('#brKim').textContent=`${s.kod} · ${B(durumAd(s.durum))}`; $('#brMetin').textContent=t('adimMetin',{ad:s.ad,sehir:s.sehir,neden:L(s.neden),yer:L(s.bag[0].e),km:sayiTR(km(s,s.bag[0]))}); }
  if($('#barkodSonuc').classList.contains('goster')) barkodSor();
}
document.querySelectorAll('.dil').forEach(b=>b.onclick=()=>{
  const yeni=b.dataset.dil; if(yeni===dil) return;
  const kaydir=[$('.sol'),$('.sag'),$('#gunluk')].filter(Boolean).map(el=>[el,el.scrollTop]);
  const uygula=()=>{ dil=yeni; try{localStorage.setItem('dil',dil)}catch(e){} dilUygula(); kaydir.forEach(([el,y])=>{ el.scrollTop=y; }); };
  if(azHareket){ uygula(); return; }
  document.body.classList.add('dil-gecis');
  setTimeout(()=>{ uygula(); document.body.classList.remove('dil-gecis'); document.body.classList.add('dil-gel');
    setTimeout(()=>document.body.classList.remove('dil-gel'),190); },120);
});

dilUygula(); gunlukCiz(true); boyutla(); acilisGoster();
</script>
